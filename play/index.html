  }
  return "";
}

function render() {
  document.documentElement.classList.toggle("has-banner", state.phase !== "lang");
  if (state.phase !== "menu") document.getElementById("infoSheet").hidden = true;
  if (typeof bannerSync === "function") bannerSync();
  langScreen.hidden = state.phase !== "lang";
  menuScreen.hidden = state.phase !== "menu";
  overlay.hidden = state.phase !== "intro";
  soloScreen.hidden = state.phase !== "solo";
  const cs = document.getElementById("careerScreen");
  if (cs) cs.hidden = state.phase !== "career";
  const vs = document.getElementById("vbScreen");
  if (vs) vs.hidden = state.phase !== "video";
  halves.forEach(h => {
    const p = Number(h.dataset.p);
    h.setAttribute("aria-label", t("half", p + 1));
    h.innerHTML = `<div class="stage">${stageHTML(p)}</div>${hud(p)}`;
    const lit =
      ((state.phase === "buzzed" || state.phase === "result") && state.buzzer === p) ||
      (state.phase === "end" && state.scores[p] > state.scores[1 - p]);
    h.classList.toggle("lit", lit);
  });
  paintClock();
}

function paintClock() {
  const on = running();
  const frac = on ? Math.max(0, state.left / state.total) : 1;
  drain.style.strokeDashoffset = String(100 * (1 - frac));
  const low = on && state.left <= (state.phase === "question" ? 3000 : 2000);
  kickoff.classList.toggle("idle", !on);
  kickoff.classList.toggle("b0", state.phase === "buzzed" && state.buzzer === 0);
  kickoff.classList.toggle("b1", state.phase === "buzzed" && state.buzzer === 1);
  kickoff.classList.toggle("low", low);
  document.querySelectorAll(".clock").forEach(el => {
    el.textContent = on ? clockText(state.left) : "–";
    el.classList.toggle("low", low);
  });
  document.querySelectorAll("[data-count]").forEach(el => {
    el.textContent = String(Math.max(0, Math.ceil(state.left / 1000)));
  });
}

/* ---------- game flow ---------- */
function startTimer() {
  clearInterval(tick);
  const deadline = performance.now() + state.left;
  tick = setInterval(() => {
    state.left = deadline - performance.now();
    if (state.left <= 0) {
      clearInterval(tick);
      state.left = 0;
      timerEnded();
    } else {
      paintClock();
    }
  }, 100);
}

function timerEnded() {
  if (state.phase === "question") {
    state.phase = "timeout";
    tone([1900, 1900, 1500], 0.12);
  } else if (state.phase === "buzzed") {
    state.answerOver = true;
    state.revealed = true;          // solutions open by themselves once the answer time is over
    tone([1900, 1500], 0.12);
  }
  render();
}

function nextQuestion() {
  state.qi = pickNext();
  remember(state.qi);
  state.swap = rand(2) === 1;
  state.buzzer = null;
  state.revealed = false;
  state.answerOver = false;
  state.outcome = null;
  state.total = THINK_MS;
  state.left = THINK_MS;
  state.phase = "question";
  state.lockUntil = performance.now() + 450;
  render();
  startTimer();
}

function newGame() {
  state.scores = [0, 0];
  keepAwake();
  nextQuestion();
}

function buzz(p) {
  if (state.phase !== "question" || performance.now() < state.lockUntil) return;
  clearInterval(tick);
  state.buzzer = p;
  state.revealed = false;
  state.answerOver = false;
  state.total = ANSWER_MS;
  state.left = ANSWER_MS;
  state.phase = "buzzed";
  tone([880, 1320], 0.08);
  buzzFeel();
  render();
  startTimer();
}

function reveal() {
  if (state.phase !== "buzzed" || state.revealed) return;
  clearInterval(tick);              // the answer has been given, so the clock stops
  state.revealed = true;
  tone([520], 0.06);
  render();
}

function judge(ok) {
  if (state.phase !== "buzzed" || !state.revealed) return;
  clearInterval(tick);
  const b = state.buzzer;
  if (ok) { state.scores[b]++; state.outcome = "hit"; tone([660, 880, 1100], 0.09); }
  else { state.scores[1 - b]++; state.outcome = "miss"; tone([330, 220], 0.16); }
  state.phase = "result";
  render();
}

function next() {
  if (Math.max(...state.scores) >= state.target) {
    finishedMatches++;
    state.phase = "end";
    tone([523, 659, 784, 1047], 0.12);
    render();
    return;
  }
  nextQuestion();
}

function goTo(phase) {
  clearInterval(tick);
  if (typeof stopSolo === "function") stopSolo();
  if (typeof stopKw === "function") { stopKw(); if (document.activeElement === kwInput) kwInput.blur(); }
  if (typeof stopVb === "function") stopVb();
  state.phase = phase;
  if (phase === "intro") renderLeagues();   // types, level and leagues may have changed in the Video-Battle
  render();
}

/* ---------- short ad after a match ---------- */
let finishedMatches = 0;   // this session
let lastAdAt = 0;
let adTick = null;
const adScreen = document.getElementById("adScreen");
const adBtn = document.getElementById("adBtn");

function afterMatch(then) {
  const now = Date.now();
  // first match of a session stays ad-free, and ads never come closer than 2 minutes apart
  if (finishedMatches <= 1 || now - lastAdAt < AD_GAP_MS) { then(); return; }
  showAd(then);
}

function showAd(done, kind, fail) {
  if (NATIVE) { nativeShowAd(done, kind, fail); return; }
  if (WEB) { done(); return; }
  const reward = kind === "reward";
  clearInterval(adTick);
  document.getElementById("adTag").textContent = t("adLabel");
  document.getElementById("adMediaLabel").textContent = t("adVideo");
  document.getElementById("adNote").textContent = reward ? t("adNoteReward") : t("adNote");
  const bar = document.getElementById("adBar");
  const dur = reward ? REWARD_MS : AD_SKIP_MS;
  const end = performance.now() + dur;
  adBtn.disabled = true;
  adScreen.hidden = false;
  adScreen.focus();
  const paint = () => {
    const left = Math.max(0, end - performance.now());
    bar.style.width = (100 * (1 - left / dur)) + "%";
    if (left > 0) {
      adBtn.textContent = reward ? t("rewardIn", Math.ceil(left / 1000)) : t("adSkipIn", Math.ceil(left / 1000));
    } else {
      clearInterval(adTick);
      adBtn.disabled = false;
      adBtn.textContent = reward ? t("claim") : t("adSkip");
      adBtn.focus();
    }
  };
  paint();
  adTick = setInterval(paint, 100);
  adBtn.onclick = () => {
    if (adBtn.disabled) return;
    clearInterval(adTick);
    adScreen.hidden = true;
    lastAdAt = Date.now();
    done();
  };
}

function act(a) {
  if (a === "reveal") reveal();
  else if (a === "yes") judge(true);
  else if (a === "no") judge(false);
  else if (a === "next") next();
  else if (a === "again") afterMatch(newGame);
  else if (a === "menu") afterMatch(() => goTo("intro"));
}

/* ---------- solo games: Serie and Tagesrätsel ---------- */
const SOLO_MS = 10000;
const BEST_KEY = "derby-best";
const DAILY_KEY = "derby-daily";
const DAILY_LEVELS = [1, 2, 2, 3, 4];
let soloTick = null;
let reviveTick = null;
const REVIVE_MS = 5000;
const REVIVE_MIN = 7;        // the video option only appears from 7 points on
const solo = { mode: "serie", streak: 0, best: 0, newBest: false, qi: 0, opts: [], correct: "", picked: null,
               left: SOLO_MS, lock: 0, revived: false, over: false, done: false, autoNext: null,
               day: 0, list: [], step: 0, res: [] };

function loadBest() { try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; } }
function saveBest(n) { try { localStorage.setItem(BEST_KEY, String(n)); } catch (e) {} }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function dayNumber() {
  const d = new Date();
  return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 9, 24)) / 86400000) + 1;
}
function shuffleWith(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const mathRnd = () => rand(1e9) / 1e9;

/* wrong answers come only from players whose whole career is known (see CAREERS) */
const POS_GROUP = { gk: ["gk"], cb: ["cb", "fb"], fb: ["fb", "cb"], cm: ["cm"], wg: ["wg", "st"], st: ["st", "wg"] };
function buildOptions(qi, rnd) {
  const q = Q[qi];
  const ans = new Set(q.players);
  const correct = q.players[Math.floor(rnd() * q.players.length)];
  const lgs = q.t === "cc" ? [CLUBS[q.a].lg, CLUBS[q.b].lg] : [CLUBS[q.a].lg];
  const inLeague = c => [...c.clubs].some(k => lgs.includes(CLUBS[k].lg));
  const A = [], B = [], C = [];
  for (const [name, c] of CAREER) {
    if (ans.has(name)) continue;
    const atA = c.clubs.has(q.a);
    if (q.t === "cc") {
      const atB = c.clubs.has(q.b);
      if (atA && atB) continue;                      // would also be correct
      if (atA || atB) A.push(name);                  // played for exactly one of the two clubs
      else (inLeague(c) ? B : C).push(name);
    } else if (q.t === "cn") {
      const isNat = c.nat.includes(q.b);
      if (atA && isNat) continue;                    // would also be correct
      if (isNat && !atA) B.push(name);               // same country, but never played for the club
    } else {
      if (atA) continue;                             // never show players of the same club
      if (c.pos.includes(q.b)) A.push(name);         // same position at other clubs
      else if (c.pos.some(p => POS_GROUP[q.b].includes(p))) B.push(name);   // neighbouring position
    }
  }
  const chosen = [];
  const take = (arr, n) => {
    for (const p of shuffleWith(arr, rnd)) {
      if (chosen.length >= 3 || n <= 0) break;
      if (!chosen.includes(p)) { chosen.push(p); n--; }
    }
  };
  if (q.t === "cc") { take(A, 2); take(B, 1); }
  else if (q.t === "cn") take(B, 3);
  else take(A, 3);
  [A, B, C].forEach(arr => take(arr, 3 - chosen.length));
  return { opts: shuffleWith([correct, ...chosen], rnd), correct };
}

/* questions with at least three safe wrong answers (checked once) */
let SOLO_OK = null;
function soloOk(i) {
  if (!SOLO_OK) SOLO_OK = Q.map((q, k) => !CLUBS[q.a].x && !(q.t === "cc" && CLUBS[q.b].x) && buildOptions(k, () => 0.5).opts.length === 4);
  return SOLO_OK[i];
}

/* the same five questions for everyone on the same day */
function dailyList(day) {
  const rnd = mulberry32(day * 7919 + 13);
  const T = ["cc", "cn", "cp"];
  const types = shuffleWith(["cc", "cn", "cp", T[Math.floor(rnd() * 3)], T[Math.floor(rnd() * 3)]], rnd);
  const used = new Set(), out = [];
  DAILY_LEVELS.forEach((lv, k) => {
    let cands = [];
    Q.forEach((q, i) => { if (q.lv === lv && q.t === types[k] && soloOk(i) && !qTokens(i).some(x => used.has(x))) cands.push(i); });
    if (!cands.length) Q.forEach((q, i) => { if (q.lv === lv && soloOk(i) && !out.some(o => o.qi === i)) cands.push(i); });
    const qi = cands[Math.floor(rnd() * cands.length)];
    qTokens(qi).forEach(x => used.add(x));
    const o = buildOptions(qi, rnd);
    out.push({ qi, opts: o.opts, correct: o.correct });
  });
  return out;
}
function loadDaily(day) {
  try {
    const v = JSON.parse(localStorage.getItem(DAILY_KEY) || "null");
    if (v && v.day === day && Array.isArray(v.res)) return v.res.filter(x => typeof x === "boolean").slice(0, DAILY_LEVELS.length);
  } catch (e) {}
  return [];
}
function saveDaily() { try { localStorage.setItem(DAILY_KEY, JSON.stringify({ day: solo.day, res: solo.res })); } catch (e) {} }

function soloLevel() { return solo.streak < 5 ? 1 : solo.streak < 10 ? 2 : solo.streak < 20 ? 3 : 4; }

function startSolo(mode) {
  clearInterval(tick);
  stopSolo();
  Object.assign(solo, { mode, best: loadBest(), newBest: false, streak: 0, revived: false, over: false, done: false, stage: "play" });
  renderModal();
  state.phase = "solo";
  keepAwake();
  render();
  if (mode === "daily") {
    solo.day = dayNumber();
    solo.list = dailyList(solo.day);
    solo.res = loadDaily(solo.day);
    solo.step = solo.res.length;
    if (solo.step >= solo.list.length) { solo.done = true; renderSolo(); return; }
    loadDailyStep();
  } else {
    soloNextQuestion();
  }
}
function soloNextQuestion() {
  const lv = soloLevel();
  const P = [];
  Q.forEach((q, i) => { if (q.lv === lv && soloOk(i)) P.push(i); });
  const qi = pickFrom(P);
  remember(qi);
  const o = buildOptions(qi, mathRnd);
  setSoloQuestion(qi, o.opts, o.correct);
}
function loadDailyStep() {
  const it = solo.list[solo.step];
  setSoloQuestion(it.qi, it.opts, it.correct);
}
function setSoloQuestion(qi, opts, correct) {
  Object.assign(solo, { qi, opts, correct, picked: null, left: SOLO_MS, lock: performance.now() + 300 });
  renderSolo();
  startSoloTimer();
}
function startSoloTimer() {
  clearInterval(soloTick);
  const end = performance.now() + solo.left;
  soloTick = setInterval(() => {
    solo.left = Math.max(0, end - performance.now());
    paintSoloBar();
    if (solo.left <= 0) { clearInterval(soloTick); soloAnswer(-1); }
  }, 100);
}
function stopSolo() { clearInterval(soloTick); clearInterval(reviveTick); clearTimeout(solo.autoNext); }
function paintSoloBar() {
  const bar = document.getElementById("soloBar");
  bar.style.transform = `scaleX(${solo.picked === null ? solo.left / SOLO_MS : 0})`;
  bar.parentElement.classList.toggle("low", solo.left <= 3000);
}
function soloAnswer(k) {
  if (solo.picked !== null || solo.done) return;
  if (k >= 0 && performance.now() < solo.lock) return;
  stopSolo();
  solo.picked = k;
  const ok = k >= 0 && solo.opts[k] === solo.correct;
  tone(ok ? [660, 880, 1100] : [330, 220], ok ? 0.08 : 0.16);
  if (solo.mode === "daily") {
    solo.res.push(ok);
    saveDaily();
    solo.step++;
    solo.autoNext = setTimeout(soloContinue, ok ? 1500 : 2600);
  } else if (ok) {
    solo.streak++;
    if (solo.streak > solo.best) { solo.best = solo.streak; saveBest(solo.best); solo.newBest = true; }
    solo.autoNext = setTimeout(soloContinue, 1500);
  } else {
    // show the right answer for a moment, then the pop-up (one second chance per round, only from 7 points on)
    solo.autoNext = setTimeout(() => (solo.revived || solo.streak < REVIVE_MIN ? endRun() : startRevive()), 1200);
  }
  renderSolo();
}
function soloContinue() {
  clearTimeout(solo.autoNext);
  if (state.phase !== "solo") return;
  if (solo.mode === "daily") {
    if (solo.step >= solo.list.length) { solo.done = true; tone([523, 659, 784, 1047], 0.12); renderSolo(); return; }
    loadDailyStep();
    return;
  }
  if (!solo.over) soloNextQuestion();
}
/* after a mistake: 5 seconds to tap the circle and keep the streak with a video */
function startRevive() {
  solo.stage = "revive";
  solo.reviveLeft = REVIVE_MS;
  renderModal();
  const end = performance.now() + REVIVE_MS;
  clearInterval(reviveTick);
  reviveTick = setInterval(() => {
    solo.reviveLeft = Math.max(0, end - performance.now());
    paintRevive();
    if (solo.reviveLeft <= 0) endRun();
  }, 50);
}
function paintRevive() {
  const d = document.getElementById("rvDrain"), n = document.getElementById("rvNum");
  if (!d) return;
  d.style.strokeDashoffset = String(100 * (1 - solo.reviveLeft / REVIVE_MS));
  n.textContent = String(Math.max(1, Math.ceil(solo.reviveLeft / 1000)));
}
function soloRevive() {
  if (solo.stage !== "revive") return;
  clearInterval(reviveTick);
  solo.stage = "ad";
  renderModal();
  showAd(() => {
    solo.revived = true;
    solo.over = false;
    solo.stage = "play";
    renderModal();
    soloNextQuestion();
  }, "reward", endRun);   // closed the video early: no extra life
}
function endRun() {
  clearInterval(reviveTick);
  if (solo.stage === "over") return;
  solo.stage = "over";
  solo.over = true;
  tone([392, 330, 262], 0.14);
  renderModal();
}

      <span class="rv-in"><span class="rv-num" id="rvNum">5</span><span class="rv-cap">${WEB ? t("sGoOn") : "▶ " + t("sVideo")}</span></span>

}

function copyShare() {
  const msg = document.getElementById("copyMsg"), ta = document.getElementById("shareText");
  const fail = () => { ta.focus(); ta.select(); msg.textContent = t("dCopyFail"); };
  try { navigator.clipboard.writeText(dailyShareText()).then(() => { msg.textContent = t("dCopied"); }, fail); }
  catch (e) { fail(); }
}

function renderSolo() {
  const body = document.getElementById("soloBody");
  const stats = document.getElementById("soloStats");
  if (solo.mode === "daily") {
    const score = solo.res.filter(Boolean).length;
    stats.innerHTML = `<span>${t("dTitle", solo.day)}<b>${score}/${solo.list.length}</b></span>`;
  } else {
    stats.innerHTML = `<span>${t("sStreak")}<b>${solo.streak}</b></span><span>${t("sBest")}<b>${solo.best}</b></span>`;
  }
  document.getElementById("soloBarWrap").hidden = solo.done;
  if (solo.mode === "daily" && solo.done) { body.innerHTML = dailyDoneHTML(); return; }
  if (!solo.opts.length) { body.innerHTML = ""; return; }
  const q = Q[solo.qi];
  const answered = solo.picked !== null;
  const kicker = solo.mode === "daily"
    ? t("dQ", answered ? solo.step : solo.step + 1, solo.list.length)
    : `${t("sLevel")}: ${t("lv" + soloLevel())}`;
  const opts = solo.opts.map((name, k) => {
    let cls = "opt";
    if (answered) cls += name === solo.correct ? " ok" : k === solo.picked ? " bad" : " dim";
    return `<button class="${cls}" type="button" data-opt="${k}"${answered ? " disabled" : ""}><i>${k + 1}</i><span>${name}</span></button>`;
  }).join("");
  let fb = "";
  if (answered) {
    const ok = solo.picked >= 0 && solo.opts[solo.picked] === solo.correct;
    fb = `<p class="fb-title ${ok ? "good" : "badc"}">${ok ? t("sRight") : solo.picked < 0 ? t("sTime") : t("sWrong")}</p>`;
    if (!(solo.mode === "serie" && !ok)) fb += `<button class="btn" type="button" data-solo="next">${t("next")}</button>`;
  }
  body.innerHTML = `<p class="solo-kicker">${kicker}</p>${pairHTML(q)}
    <p class="ask">${t(q.t === "cc" ? "ask" : "ask_" + q.t)}</p>
    <div class="opts">${opts}</div>
    <div class="solo-fb" aria-live="polite">${fb}</div>`;
  paintSoloBar();
}

document.getElementById("soloBody").addEventListener("click", e => {
  const o = e.target.closest("[data-opt]");
  if (o) { soloAnswer(Number(o.dataset.opt)); return; }
  const b = e.target.closest("[data-solo]");
  if (!b) return;
  const a = b.dataset.solo;
  if (a === "next") soloContinue();
  else if (a === "revive") soloRevive();
  else if (a === "again") startSolo("serie");
  else if (a === "games") goTo("menu");
  else if (a === "copy") copyShare();
});
document.getElementById("soloModal").addEventListener("click", e => {
  const b = e.target.closest("[data-solo]");
  if (!b) return;
  const a = b.dataset.solo;
  if (a === "revive") soloRevive();
  else if (a === "end") endRun();
  else if (a === "again") startSolo("serie");
  else if (a === "games") { solo.stage = "play"; renderModal(); goTo("menu"); }
});

function kwTokens(s, german) {
  s = s.toLowerCase().replace(/['’`´]/g, "").replace(/-/g, "");
  if (german) s = s.replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ø/g, "oe");
  s = s.replace(/ß/g, "ss").replace(/ø/g, "o").replace(/æ/g, "ae").replace(/œ/g, "oe")
    .replace(/ł/g, "l").replace(/ı/g, "i").replace(/đ/g, "d");
  s = s.normalize("NFD").replace(/[̀-ͯ]/g, "");
  return s.replace(/[^a-z0-9]+/g, " ").trim().split(" ").filter(Boolean);
}
function kwInputKeys(s) {
  return [...new Set([false, true].map(g => kwTokens(s, g).join("")).filter(Boolean))];
}
const KW_KEYS = KW.map(c => {
  const keys = new Set(), full = new Set();
  [false, true].forEach(g => {
    const tok = kwTokens(c.name, g);
    full.add(tok.join(""));
    for (let i = 0; i < tok.length; i++) {
      const k = tok.slice(i).join("");
      if (k.length >= 3 || i === 0) keys.add(k);
    }
    (KW_ALIAS[c.name] || []).forEach(a => { const k = kwTokens(a, g).join(""); if (k) keys.add(k); });
  });
  full.forEach(k => keys.add(k));
  return { keys, full };
});
function kwLev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      rowMin = Math.min(rowMin, cur[j]);
    }
    if (rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
/* "right", "wrong", "ambiguous" (fits several players, so ask for the full name) or "empty" */
function kwCheck(text, ci) {
  const inp = kwInputKeys(text);
  if (!inp.length) return "empty";
  const hits = new Set();
  KW_KEYS.forEach((e, i) => { if (inp.some(v => e.keys.has(v))) hits.add(i); });
  if (hits.size) {
    if (!hits.has(ci)) return "wrong";
    if (hits.size === 1) return "right";
    if (inp.some(v => KW_KEYS[ci].full.has(v))) return "right";
    return "ambiguous";
  }
  // small typos: one wrong letter in names from 5 letters, two from 9 letters
  let mine = 99, other = 99;
  KW_KEYS.forEach((e, i) => {
    e.keys.forEach(k => {
      const lim = k.length >= 9 ? 2 : k.length >= 5 ? 1 : 0;
      if (!lim) return;
      inp.forEach(v => {
        const d = kwLev(v, k, lim);
        if (d > lim) return;
        if (i === ci) mine = Math.min(mine, d); else other = Math.min(other, d);
      });
    });
  });
  if (mine === 99) return "wrong";
  if (mine < other) return "right";
  return mine === other ? "ambiguous" : "wrong";
}
function kwEsc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function kwClub(k) {

/* careers for one round: all from the chosen difficulty, the ones you have not seen for longest first */
function kwPickRound(mode) {
  const hist = kwHist();
  const seen = name => { const i = hist.lastIndexOf(name); return i < 0 ? -1 : i; };
  const pool = KW.map((c, i) => i).filter(i => KW[i].lv === kw.diff && (mode === "solo" || KW[i].st.length <= KW_DUEL_MAX));
  const used = new Set();
  const out = [];
  while (out.length < KW_ROUNDS && used.size < pool.length) {
    const cand = pool.filter(i => !used.has(i)).sort((a, b) => seen(KW[a].name) - seen(KW[b].name));
    const fresh = cand.filter(i => seen(KW[i].name) < 0);
    const from = fresh.length ? fresh : cand.slice(0, Math.max(4, Math.ceil(cand.length / 3)));
    const i = from[rand(from.length)];
    used.add(i);
    out.push(i);
  }
  return out;
}

/* ---------- flow ---------- */
function kwOpen(mode) {
  stopKw();
  clearInterval(tick);
  if (typeof stopSolo === "function") stopSolo();

  state.phase = "career";

  kwRender();
}

}
function kwLoad(k) {
  stopKw();
  const now = performance.now();
  const ci = kw.list[k];
  const n = KW[ci].st.length;
  Object.assign(kw, {
    k, ci, shown: 1, fresh: 1, picked: null, gained: 0, hint: null, tries: KW_TRIES, leftShown: -1,
    buzzer: -1, buzzEnd: 0, revealed: false, timeUp: false, result: null, cdShown: -1,
    step: kwStepMs(n), nextAt: now + kwStepMs(n), endAt: n <= 1 ? now + KW_FINAL_MS : 0, lockUntil: now + 500
  });

/* solo: the player decides when to see the next club */
function kwMore() {

  if (kw.shown >= KW[kw.ci].st.length) return;
  kw.shown++;
  kw.fresh = kw.shown;
  kw.hint = null;
  tone([520], 0.03);

}
function kwGuess(raw) {

  if (kw.picked !== null) { kwNext(); return; }
  const text = raw.trim();
  const c = KW[kw.ci], n = c.st.length;
  const r = kwCheck(text, kw.ci);
  if (r === "empty") return;
  if (r === "right") {
    kw.picked = "right";
    kw.gained = 1;
    kw.scores[0] += kw.gained;
    kw.hint = null;
    kwRevealAll();
    kwInput.value = "";
    tone([660, 880, 1100], 0.08);

    kw.hint = { bad: false, text: t("kwAmbig") };
    tone([440], 0.05);
  } else {
    kwInput.value = "";
    kwShake();
    kw.tries--;
    if (kw.tries > 0) {

      tone([330], 0.08);
    } else {
      kw.picked = "wrong";
      kw.gained = 0;
      kw.hint = { bad: true, text: t("kwNope", text) };

  kwRevealAll();

/* buzzer (duel and solo): tap, say the name, then the answer is judged */
function kwOnTick() {
  if (state.phase !== "career" || kw.stage !== "play" || !kwTimed() || kwDone()) { clearInterval(kwTick); return; }
  if (!adScreen.hidden) return;
  const now = performance.now();
  if (kw.buzzer >= 0) {
    if (kw.revealed) return;
    const left = Math.max(0, Math.ceil((kw.buzzEnd - now) / 1000));
    if (left !== kw.cdShown) {
      kw.cdShown = left;
      careerScreen.querySelectorAll(".kw-cd").forEach(el => { el.textContent = left; });
      if (left > 0 && left <= 3) tone([440], 0.04);
    }
    if (now >= kw.buzzEnd) { kw.timeUp = true; kwReveal(); }
    return;
  }
  const n = KW[kw.ci].st.length;
  let changed = false;
  while (kw.shown < n && now >= kw.nextAt) {
    kw.shown++;
    kw.fresh = kw.shown;
    if (kw.shown >= n) kw.endAt = kw.nextAt + KW_FINAL_MS;
    kw.nextAt += kw.step;
    changed = true;
  }
  if (kw.shown >= n && kw.endAt && now >= kw.endAt) { if (kw.mode === "duel") kwNobody(); else kwLate(); return; }
  if (changed) { tone([520], 0.03); kwRender(); }
  else if (kw.mode === "solo" && kw.endAt) {
    const left = Math.max(0, Math.ceil((kw.endAt - now) / 1000));
    if (left !== kw.leftShown) {
      kw.leftShown = left;
      const el = document.getElementById("kwLeft");
      if (el) el.textContent = t("kwLeft", left);
    }
  }
}
function kwBuzz(p) {

  buzzFeel();
  kw.buzzer = p;
  kw.buzzEnd = performance.now() + KW_GUESS_MS;
  kw.cdShown = Math.ceil(KW_GUESS_MS / 1000);
  tone([880, 1320], 0.07);
  kwRender();
}
function kwReveal() {
  if (kw.buzzer < 0 || kw.revealed || kwDone()) return;
  kw.revealed = true;

  tone([600], 0.05);

function kwJudge(ok) {
  if (kw.buzzer < 0 || !kw.revealed || kwDone()) return;
  if (kw.mode === "solo") {
    kw.picked = ok ? "right" : "wrong";
    kw.gained = ok ? 1 : 0;
    kw.scores[0] += kw.gained;
    kwRevealAll();
    tone(ok ? [660, 880, 1100] : [330, 220], ok ? 0.08 : 0.14);
    kwRender();
    return;
  }
  const p = kw.buzzer;
  if (ok) kw.scores[p]++; else kw.scores[1 - p]++;
  kw.result = { type: ok ? "right" : "wrong", p };
  kwRevealAll();
  tone(ok ? [660, 880, 1100] : [330, 220], ok ? 0.08 : 0.14);

/* ---------- rendering ---------- */
function kwPathHTML(c, shown, openNext, freshIdx) {
  const n = c.st.length;
  const items = c.st.map((s, i) => {
    if (i === shown && openNext) {
      return `<li class="kw-st hid next" role="button" tabindex="0" data-kw="more" data-keep><span class="kw-no">${i + 1}</span><span class="kw-badge q" aria-hidden="true">+</span><span class="kw-txt"><b>${t("kwUncover")}</b></span></li>`;
    }
    if (i >= shown) {
      return `<li class="kw-st hid"><span class="kw-no">${i + 1}</span><span class="kw-badge q" aria-hidden="true">?</span><span class="kw-txt"><span class="kw-ph"></span></span></li>`;
    }
    const cl = kwClub(s.k);
    const loan = s.loan ? `<span class="kw-loan">${t("kwLoan")}</span>` : "";
    const fresh = (freshIdx !== undefined ? freshIdx === i + 1 : kw.fresh === i + 1 && !kwDone()) ? " new" : "";
    const yy = `<span class="yl">${s.y}</span><span class="ys">${s.y.replace(/\b(?:19|20)(\d\d)\b/g, "$1")}</span>`;
    return `<li class="kw-st${fresh}"><span class="kw-no">${i + 1}</span><span class="kw-badge" style="background:${cl.c1};color:${cl.ink}" aria-hidden="true">${cl.s}</span><span class="kw-txt"><b>${cl.n}</b><small>${yy}${loan}</small></span></li>`;
  }).join("");
  return `<ol class="kw-path" data-n="${n}" aria-label="${t("kwStation", shown, n)}">${items}</ol>`;
}

/* the roomiest look that still fits: big rows in one column, then two columns, then ever smaller rows */
const KW_FIT_LONG = [["xl", 1], ["xl", 2], ["roomy", 2], ["", 2], ["d1", 2], ["d2", 2], ["d3", 2], ["d4", 2]];
const KW_FIT_SHORT = [["xl", 1], ["roomy", 1], ["", 1], ["d1", 1], ["d2", 1], ["d3", 1], ["d4", 1]];
function kwApplyLook(ol, d, cols) {
  const n = Number(ol.dataset.n);
  ol.className = "kw-path" + (d === "xl" ? "" : " compact" + (d ? " " + d : "")) + (cols === 2 ? " two" : "");
  ol.style.gridTemplateRows = cols === 2 ? `repeat(${Math.ceil(n / 2)}, auto)` : "";
}
function kwFit(ols, box) {
  if (!ols.length || !box || !box.clientHeight) return;
  const ladder = Number(ols[0].dataset.n) <= 5 ? KW_FIT_SHORT : KW_FIT_LONG;
  for (let i = 0; i < ladder.length; i++) {
    ols.forEach(ol => kwApplyLook(ol, ladder[i][0], ladder[i][1]));
    if (i === ladder.length - 1 || ols[0].getBoundingClientRect().height <= box.getBoundingClientRect().height + 0.5) break;
  }
  ols.forEach(kwShrinkNames);
}
/* a club name that is a little too long for its row gets a slightly smaller font instead of "…" */
function kwShrinkNames(ol) {
  ol.querySelectorAll(".kw-st:not(.hid) .kw-txt b").forEach(b => {
    b.style.fontSize = "";
    if (b.scrollWidth <= b.clientWidth + 1) return;
    const size = parseFloat(getComputedStyle(b).fontSize);
    const scale = Math.max(0.78, b.clientWidth / b.scrollWidth);
    b.style.fontSize = (size * scale).toFixed(1) + "px";
  });
}
function kwFitAll() {
  if (state.phase !== "career" || kw.stage !== "play") return;
  if (kw.mode === "solo") {
    const main = document.getElementById("kwMain");
    kwFit([...main.querySelectorAll(".kw-path")], main);
    const goal = main.querySelector(".kw-st.next") || [...main.querySelectorAll(".kw-st:not(.hid)")].pop();
    if (goal && main.scrollHeight > main.clientHeight) {
      const g = goal.getBoundingClientRect(), m = main.getBoundingClientRect();
      if (g.top < m.top) main.scrollTop += g.top - m.top - 4;
      else if (g.bottom > m.bottom) main.scrollTop += g.bottom - m.bottom + 4;
    }
  } else {
    const ols = [...kwDuelEl.querySelectorAll(".kw-path")];
    if (ols.length) kwFit(ols, ols[0].parentElement);

}
/* the solo screen follows the visible area, so the field stays above the phone keyboard */

/* while the keyboard is up (a visible text field has focus) the banner steps aside */

function kwSoloRender() {
  const c = KW[kw.ci], n = c.st.length, answered = kw.picked !== null;
  const shown = answered ? n : kw.shown;
  document.getElementById("kwKick").textContent = `${t("kwCareer", kw.k + 1, kw.list.length)} · ${t("kwStation", shown, n)}`;

  // buzzer mode: one big button, then the countdown, then your own verdict

function kwHalfHTML(p) {
  const op = 1 - p;
  const cnt = kw.stage === "play" ? `<small class="kw-cnt">${kw.k + 1}/${kw.list.length}</small>` : "";
  const hud = `<div class="kw-hud"><span class="who">${pName(p)}${cnt}</span><span class="kw-tally"><b>${kw.scores[p]}</b><span>:</span><span>${kw.scores[op]}</span><small>${t("opp")}</small></span></div>`;
  if (kw.stage === "end") {
    const me = kw.scores[p], other = kw.scores[op];

    return `<div class="kw-end">

      <p class="kw-end-score">${t("final", me, other)}</p>

  let act;
  if (kw.result) {
    const r = kw.result;

    else if (r.type === "right") { good = r.p === p; res = good ? t("kwPlusYou") : t("kwPlusOpp", pName(r.p)); }
    else { good = r.p !== p; res = good ? t("kwWrongYou") : t("kwWrongOpp", pName(op)); }
    act = `${name}<div class="kw-hres"><p class="${good ? "good" : r.type === "none" ? "" : "badc"}">${res}</p><button class="kw-mini" type="button" data-kw="next">${kw.k + 1 >= kw.list.length ? t("kwResult") : t("next")}</button></div>`;
  } else if (kw.buzzer >= 0 && kw.revealed) {
    act = kw.buzzer === p
      ? `${name}<p class="kw-say">${kw.timeUp ? t("kwTimeUp") + " " : ""}${t("kwJudging", pName(op))}</p>`
      : `${name}<p class="kw-say">${kw.timeUp ? t("kwTimeUp") + " " : ""}${t("kwJudgeQ", pName(kw.buzzer))}</p>

  }
  return `<div class="kw-hmain" aria-label="${t("kwCareer", kw.k + 1, kw.list.length)}">${kwPathHTML(c, shown)}</div><div class="kw-act">${act}</div>${hud}`;

function kwRender() {
  queueMicrotask(bannerSync);
  if (state.phase !== "career") return;

  if (showModal) { const b = card.querySelector(".go"); if (b) b.focus({ preventScroll: true }); }
  if (solo) {
    document.getElementById("kwStats").innerHTML =
      `<span>${t("kwPoints")}<b>${kw.scores[0]}</b></span><span>${t("sBest")}<b>${Math.max(kw.best, kwLoadBest())}</b></span>`;
    const playing = kw.stage === "play" || kw.stage === "end";
    document.getElementById("kwBody").hidden = !playing || !kw.list.length;
    kwForm.hidden = kw.stage !== "play" || kw.smode !== "type";
    document.getElementById("kwHint").hidden = kw.smode !== "type";
    document.getElementById("kwSAct").hidden = kw.stage !== "play" || kw.smode !== "buzz";
    if (playing && kw.list.length) kwSoloRender();
  } else if (kw.stage !== "intro") {
    kwHalves.forEach(h => {
      const p = Number(h.dataset.p);
      h.innerHTML = kwHalfHTML(p);
      h.setAttribute("aria-label", t("half", p + 1));
      let lit = false;
      if (kw.stage === "end") lit = kw.scores[p] > kw.scores[1 - p];
      else if (kw.result) lit = (kw.result.type === "right" && kw.result.p === p) || (kw.result.type === "wrong" && kw.result.p !== p);
      else lit = kw.buzzer === p;
      h.classList.toggle("lit", lit);
      h.classList.toggle("wait", kw.stage === "play" && !kw.result && kw.buzzer >= 0 && kw.buzzer !== p);
    });
  }
  kwFitAll();
  kw.fresh = 0;
}

/* ---------- input ---------- */
function kwAct(a) {
  if (a === "start") kwStartRound();
  else if (a === "more") kwMore();
  else if (a === "give") kwGiveUp();
  else if (a === "sbuzz") kwBuzz(0);
  else if (a === "m-type" || a === "m-buzz") kwSetMode(a.slice(2));
  else if (/^d-[1-4]$/.test(a)) kwSetDiff(Number(a.slice(2)));
  else if (a === "next") kwNext();
  else if (a === "reveal") kwReveal();
  else if (a === "yes") kwJudge(true);
  else if (a === "no") kwJudge(false);
  else if (a === "again") afterMatch(kwStartRound);
  else if (a === "games") {
    if (kw.stage === "end") afterMatch(() => goTo("menu"));
    else goTo("menu");
  }
}
careerScreen.addEventListener("click", e => {
  const b = e.target.closest("[data-kw]");
  if (b && b.dataset.kw !== "buzz") kwAct(b.dataset.kw);
});
// buttons next to the name field must not take the focus, or the phone keyboard closes
careerScreen.addEventListener("mousedown", e => { if (e.target.closest("[data-keep]")) e.preventDefault(); });
kwForm.addEventListener("submit", e => {
  e.preventDefault();
  kwGuess(kwInput.value);
});
kwInput.addEventListener("animationend", () => kwInput.classList.remove("shake"));
careerScreen.addEventListener("keydown", e => {
  const r = e.target.closest && e.target.closest('[role="button"][data-kw]');
  if (r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); kwAct(r.dataset.kw); }
});
// the whole half is the buzzer; pointerdown so that the faster finger wins
kwHalves.forEach(h => {
  h.addEventListener("pointerdown", e => {
    const b = e.target.closest("button");
    if (b && b.dataset.kw !== "buzz") return;
    if (kw.mode !== "duel" || kw.stage !== "play" || kw.buzzer >= 0 || kw.result) return;
    e.preventDefault();
    kwBuzz(Number(h.dataset.p));
  });
});
document.getElementById("kwBack").addEventListener("click", () => goTo("menu"));
document.getElementById("kwQuit").addEventListener("click", () => goTo("menu"));
document.addEventListener("keydown", e => {
  if (state.phase !== "career" || kw.mode !== "solo" || kw.stage !== "play" || !adScreen.hidden) return;
  if (e.target === kwInput) {
    if (e.key === "ArrowDown" && !kwInput.value) { e.preventDefault(); kwMore(); }
    return;
  }
  if (e.target !== document.body) return;
  if (kw.smode === "buzz" && (e.key === " " || e.key === "Enter")) {
    e.preventDefault();
    if (kw.picked !== null) kwNext();
    else if (kw.buzzer < 0) kwBuzz(0);
    else if (!kw.revealed) kwReveal();
    return;
  }
  if (e.key === "Enter" && kw.picked !== null) kwNext();
});

/* ---------- Video-Battle: two friends in front of one screen, made to be filmed and posted ---------- */
const VB_NAMES_KEY = "derby-vb-names";
const VB_TARGET_KEY = "derby-vb-target";
const VB_COUNT_MS = 800;         // each step of the 3, 2, 1
const VB_PACE = 0.8;   // the career video reveals 20 % faster than the 2-player game
const VB_TARGETS = [3, 5, 10];
const LEAGUE_LABEL = { bl: "Bundesliga", pl: "Premier League", ll: "La Liga", sa: "Serie A", l1: "Ligue 1", tsl: "Süper Lig", ere: "Eredivisie", mls: "MLS", bl2: "2. Bundesliga" };

const vbScreen = document.getElementById("vbScreen");
const vbWrap = document.getElementById("vbWrap");
const vb = {
  game: "transfer", stage: "setup", names: ["", ""], scores: [0, 0], target: 5, round: 0,
  count: 3, qi: -1, swap: false, usedQ: new Set(), ci: -1, shown: 1, fresh: 0, step: 2500, nextAt: 0,
  winner: null, prevShown: 1, timer: null
};
try {
  const n = JSON.parse(localStorage.getItem(VB_NAMES_KEY) || "[]");
  if (Array.isArray(n)) vb.names = [String(n[0] || ""), String(n[1] || "")];
  const tg = Number(localStorage.getItem(VB_TARGET_KEY));
  if (VB_TARGETS.includes(tg)) vb.target = tg;
} catch (e) {}

function vbName(p) { return (vb.names[p] || "").trim() || pName(p); }
function stopVb() { clearInterval(vb.timer); vb.timer = null; }

function vbOpen(game) {
  stopKw();
  stopVb();
  clearInterval(tick);
  if (typeof stopSolo === "function") stopSolo();
  vb.game = game;
  vb.stage = "setup";
  state.phase = "video";
  render();
  vbRender();
  vbScreen.scrollTop = 0;
}
function vbStart() {
  vb.names = [0, 1].map(p => (document.getElementById("vbN" + p)?.value || vb.names[p] || "").trim().slice(0, 14));
  try { localStorage.setItem(VB_NAMES_KEY, JSON.stringify(vb.names)); } catch (e) {}
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  vb.scores = [0, 0];
  vb.round = 0;
  keepAwake();
  vbNextRound();
}

/* a new question, after 3, 2, 1 */
function vbNextRound() {
  stopVb();
  vb.round++;
  vb.winner = null;
  if (vb.game === "transfer") {
    const p = pool();
    let cand = p.filter(i => !vb.usedQ.has(i));
    if (!cand.length) { vb.usedQ.clear(); cand = p.slice(); }
    vb.qi = cand[rand(cand.length)];
    vb.usedQ.add(vb.qi);
    vb.swap = rand(2) === 1;
  } else {
    const hist = kwHist();
    const seen = name => hist.lastIndexOf(name);
    const cand = KW.map((c, i) => i).filter(i => KW[i].lv === kw.diff).sort((a, b) => seen(KW[a].name) - seen(KW[b].name));
    const fresh = cand.filter(i => seen(KW[i].name) < 0);
    const from = fresh.length ? fresh : cand.slice(0, Math.max(4, Math.ceil(cand.length / 3)));
    vb.ci = from[rand(from.length)];
    kwRemember(KW[vb.ci].name);
    vb.shown = 1;
    vb.fresh = 1;
    vb.step = Math.round(kwStepMs(KW[vb.ci].st.length) * VB_PACE);
  }
  vb.stage = "count";
  vb.count = 3;
  tone([520], 0.06);
  vbRender();
  vb.timer = setInterval(() => {
    if (!adScreen.hidden) return;
    vb.count--;
    if (vb.count > 0) { tone([520], 0.06); vbRender(); return; }
    stopVb();
    tone([880, 1175], 0.08);
    vbPlay();
  }, VB_COUNT_MS);
}
function vbPlay() {
  vb.stage = "play";
  if (vb.game === "career") {
    vb.nextAt = performance.now() + vb.step;
    vb.timer = setInterval(vbReveal, 100);
  }
  vbRender();
}
/* career: the clubs come one by one; once all are there, it just waits */
function vbReveal() {
  if (vb.stage !== "play" || state.phase !== "video") { stopVb(); return; }
  if (!adScreen.hidden) return;
  const n = KW[vb.ci].st.length;
  if (vb.shown >= n) { stopVb(); return; }
  if (performance.now() < vb.nextAt) return;
  vb.shown++;
  vb.fresh = vb.shown;
  vb.nextAt += vb.step;
  tone([520], 0.03);
  vbRender();
}
function vbPoint(p) {
  if (vb.stage !== "play") return;
  stopVb();
  buzzFeel();
  if (vb.game === "transfer" && p >= 0) {   // Doppelpass: who answered first, then check the answer
    vb.buzzer = p;
    vb.stage = "judge";
    tone([880], 0.06);
    vbRender();
    return;
  }
  vb.verdict = null;
  vb.prevShown = vb.shown;
  vb.winner = p;
  if (p >= 0) vb.scores[p]++;
  if (vb.game === "career") vb.shown = KW[vb.ci].st.length;
  vb.fresh = 0;
  vb.stage = "result";
  tone(p >= 0 ? [660, 880, 1100] : [330, 220], p >= 0 ? 0.08 : 0.12);
  vbRender();
}
/* right: a point for whoever answered; wrong: the point goes to the other player */
function vbJudge(right) {
  if (vb.stage !== "judge") return;
  const p = right ? vb.buzzer : 1 - vb.buzzer;
  vb.verdict = right ? "right" : "wrong";
  vb.prevShown = vb.shown;
  vb.winner = p;
  vb.scores[p]++;
  vb.stage = "result";
  tone(right ? [660, 880, 1100] : [330, 220], right ? 0.08 : 0.12);
  vbRender();
}
function vbJudgeBack() {   // the wrong name was tapped
  if (vb.stage !== "judge") return;
  vb.buzzer = -1;
  vbPlay();
}
function vbUndo() {
  if (vb.stage !== "result") return;
  if (vb.winner >= 0) vb.scores[vb.winner]--;
  vb.winner = null;
  vb.verdict = null;
  vb.buzzer = -1;
  vb.shown = vb.prevShown;
  vbPlay();
}
function vbOver() { return vb.scores[0] >= vb.target || vb.scores[1] >= vb.target; }
function vbNext() {
  if (vb.stage !== "result") return;
  if (vbOver()) {
    vb.stage = "end";
    finishedMatches++;
    tone([523, 659, 784, 1047], 0.12);
    vbRender();
  } else vbNextRound();
}

/* ---------- rendering ---------- */
function vbChip(attr, on, label) {
  return `<button class="vb-chip" type="button" ${attr} aria-pressed="${on}">${label}</button>`;
}
function vbSetupHTML() {
  const transfer = vb.game === "transfer";
  const rules = (transfer ? ["vbRuleT1", "vbRuleT2", "vbRuleT3"] : ["vbRuleC1", "vbRuleC2", "vbRuleC3"]).map(k => `<li>${t(k)}</li>`).join("");
  const field = p => `<label class="vb-field p${p}"><span>${t("vbPlayer", p + 1)}</span>
      <input id="vbN${p}" type="text" maxlength="14" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="words" enterkeyhint="next"
        placeholder="${kwEsc(pName(p))}" value="${kwEsc(vb.names[p])}"></label>`;
  let opts;
  if (transfer) {
    const ty = TYPES.map(x => vbChip(`data-vb="ty-${x}"`, state.types.includes(x), t("t" + x.toUpperCase()))).join("");
    const notes = [state.types.includes("cn") ? t("noteCN") : "", state.types.includes("cp") ? t("noteCP") : ""].filter(Boolean).join(" ");

function vbFitNames() {
  vbWrap.querySelectorAll(".vb-tn").forEach(el => {
    el.style.fontSize = "";
    if (el.scrollWidth <= el.clientWidth + 1) return;
    const size = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = (size * Math.max(0.6, el.clientWidth / el.scrollWidth)).toFixed(1) + "px";
  });
  vbWrap.querySelectorAll(".vb-name, .vb-end-name").forEach(box => {
    const nm = box.querySelector(".vb-nm");
    if (!nm) return;
    box.classList.remove("wrap");
    box.style.fontSize = "";
    const cs = getComputedStyle(box);
    const avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const w = nm.getBoundingClientRect().width;
    if (w <= avail + 1) return;
    const scale = avail / w;
    box.style.fontSize = (parseFloat(cs.fontSize) * Math.max(0.55, scale)).toFixed(1) + "px";
    if (scale < 0.55) box.classList.add("wrap");
  });
}

function webAnchorSync() {

async function nativeAdsBoot() {

  } catch (e) { nads.npa = true; }   // no answer from Google's consent service: only non-personalised ads

  CAP.addListener("AdMob", "onRewardedVideoAdFailedToShow", () => { nads.reward = false; nads.earned = true; finish(); loadReward(); });

/* the banner is on wherever the layout keeps room for it, and steps aside for the keyboard */
function syncNativeBanner() {
  if (!NATIVE || !nads.on) return;
  const root = document.documentElement;
  const want = root.classList.contains("has-banner") && !root.classList.contains("kb-open");
  if (want === nads.bannerShown) return;
  nads.bannerShown = want;
  if (want && !nads.bannerMade) {
    nads.bannerMade = true;
    admob("showBanner", { ...adOpts("banner"), adSize: "ADAPTIVE_BANNER", position: "BOTTOM_CENTER", margin: 0 })
      .catch(() => { nads.bannerMade = false; nads.bannerShown = false; });
  } else if (nads.bannerMade) {
    admob(want ? "resumeBanner" : "hideBanner").catch(() => {});
  }
}
/* "Info & Rechtliches": language, ad privacy choices, privacy policy, legal notice */
const infoSheet = document.getElementById("infoSheet");
function renderInfo() {
  document.getElementById("infoClose").setAttribute("aria-label", t("infoClose"));
  document.getElementById("infoVer").textContent = "Derby" + (APP_CFG.version ? " · " + t("infoVersion", APP_CFG.version) : "");
  if (infoSheet.hidden) return;
  const safe = u => /^https:\/\/[^\s"'<>]+$/.test(u || "") ? u : "";
  const go = `<span class="info-go" aria-hidden="true">›</span>`;
  const link = (url, key) => safe(url)
    ? `<a class="info-row" href="${safe(url)}"><span>${t(key)}</span><span class="info-val"></span>${go}</a>`
    : `<div class="info-row off" aria-disabled="true"><span>${t(key)}</span><span class="info-val">${t("infoSoon")}</span></div>`;
  const rows = [`<button class="info-row" type="button" data-info="lang"><span>${t("infoLang")}</span><span class="info-val">${LANG_NAMES[state.lang]}</span>${go}</button>`];
  if ((NATIVE && nads.privacy) || (ADS_WEB && webAds.consent)) rows.push(`<button class="info-row" type="button" data-info="ads"><span>${t("infoAds")}</span><span class="info-val"></span>${go}</button>`);
  if (WEB && safe(APP_CFG.homeUrl)) rows.push(link(APP_CFG.homeUrl, "infoHome"));
  rows.push(link(APP_CFG.privacyUrl, "infoPrivacy"), link(APP_CFG.imprintUrl, "infoImprint"));
  document.getElementById("infoList").innerHTML = rows.join("");
}
function openInfo() { infoSheet.hidden = false; renderInfo(); document.getElementById("infoClose").focus(); }
function closeInfo() { if (infoSheet.hidden) return; infoSheet.hidden = true; document.getElementById("infoBtn").focus({ preventScroll: true }); }
document.getElementById("infoBtn").addEventListener("click", openInfo);
document.getElementById("infoClose").addEventListener("click", closeInfo);
infoSheet.addEventListener("click", e => {
  if (e.target === infoSheet) { closeInfo(); return; }
  const r = e.target.closest("[data-info]");
  if (!r) return;
  if (r.dataset.info === "lang") { infoSheet.hidden = true; goTo("lang"); }
  else if (r.dataset.info === "ads") {
    if (NATIVE) admob("showPrivacyOptionsForm").catch(() => {});
    else if (window.googlefc && typeof googlefc.showRevocationMessage === "function") { infoSheet.hidden = true; googlefc.showRevocationMessage(); }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeInfo(); });
/* Android back button: one step back, and out of the app from the start screen */
function nativeBack() {
  if (!adScreen.hidden) return;
  if (!infoSheet.hidden) { closeInfo(); return; }
  const p = state.phase;
  const exit = () => CAP.nativePromise("App", "exitApp", {}).catch(() => {});
  if (p === "lang") { exit(); return; }
  if (p === "menu") {
    if (state.menuCat) { state.menuCat = null; renderMenu(); menuScreen.scrollTop = 0; }
    else exit();
    return;
  }
  if (p === "intro") { goTo("menu"); return; }
  if (p === "solo") { document.getElementById("soloBack").click(); return; }
  if (p === "career") { goTo("menu"); return; }
  if (p === "video") {
    if (vb.stage === "judge") { vbJudgeBack(); return; }
    const b = vbWrap.querySelector('[data-vb="quit"], [data-vb="menu"]');
    if (b) b.click(); else goTo("menu");
    return;
  }
  goTo("intro");   // a Doppelpass match on the pitch: back to its setup
}
if (NATIVE) {
  document.documentElement.classList.add("native");
  document.documentElement.style.setProperty("--banner-h", "0px");   // no room for a banner until one has loaded
  CAP.addListener("App", "backButton", nativeBack);
  nativeAdsBoot();
}

/* ---------- boot (keeps a running match across page updates) ---------- */
window.claude?.hot?.snapshot?.(() => ({
  s: {
    phase: state.phase, lang: state.lang, leagues: state.leagues, level: state.level, types: state.types, scores: state.scores, target: state.target,
    qi: state.qi, swap: state.swap, buzzer: state.buzzer, revealed: state.revealed,
    answerOver: state.answerOver, outcome: state.outcome, total: state.total, left: state.left, v: 7
  }
}));

function start(data) {
  if (data && data.s && data.s.v === 7) Object.assign(state, data.s);
  if (state.phase === "solo" || state.phase === "career" || state.phase === "video") state.phase = "menu";
  if (!I18N[state.lang]) state.lang = "en";
  if (!Array.isArray(state.leagues) || !state.leagues.length) state.leagues = TOP5.slice();
  if (!(state.level >= 1 && state.level <= 4)) state.level = 2;
  if (!Array.isArray(state.types) || !state.types.length) state.types = TYPES.slice();
  if (!(state.qi >= 0 && state.qi < Q.length) || !pool().includes(state.qi)) { const p = pool(); state.qi = p[rand(p.length)]; }
  applyStatic();
  render();
  const ticking = (state.phase === "question") || (state.phase === "buzzed" && !state.revealed && !state.answerOver);
  if (ticking && state.left > 0) { state.lockUntil = performance.now() + 450; startTimer(); }
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
