<style>
/* Layout: a hub of football party games. Language first, then a games list; each game runs on a pitch seen from above, one half per player, the top half rotated for the opponent across the table. */
:root {
  --turf: #1d6a44;
  --turf-2: #217049;
  --turf-deep: #134a30;
  --turf-deep-2: #164f34;
  --chalk: #f4f2e8;
  --line: rgba(244, 242, 232, 0.38);
  --fill: rgba(244, 242, 232, 0.12);
  --ink: #10291c;
  --ink-soft: #3f5c4c;
  --p1: #ffc23d;
  --p2: #8fd3ff;
  --bad: #ff8f7d;
  --turf-3: #2c8556;
  --good: #4fd18b;
  --ink-line: rgba(16, 41, 28, .22);
  --ad-bg: #0d100e;
  --ad-media: #1a1f1c;
  --ad-stripe: #222924;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--turf-deep); }
/* the banner ad at the bottom takes --ad-h; --sab is the bottom safe area that is still free above it */
:root { --ad-h: 0px; --sab: env(safe-area-inset-bottom, 0px); }
html.has-banner { --ad-h: calc(var(--banner-h, 50px) + env(safe-area-inset-bottom, 0px)); --sab: 0px; }
html.has-banner.kb-open { --ad-h: 0px; --sab: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--turf-deep);
  color: var(--chalk);
  font-family: var(--body);
  font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px;
  padding-bottom: calc(12px + var(--ad-h));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; }
[hidden] { display: none !important; }

/* ---------- full-screen screens (language, games) ---------- */
.screen {
  position: fixed;
  inset: 0 0 var(--ad-h) 0;
  z-index: 30;
  overflow-y: auto;
  background: repeating-linear-gradient(to bottom, var(--turf-deep) 0 52px, var(--turf-deep-2) 52px 104px);
  padding: calc(env(safe-area-inset-top, 0px) + 28px) max(16px, env(safe-area-inset-right, 0px)) calc(var(--sab) + 28px) max(16px, env(safe-area-inset-left, 0px));
}
.brand {
  min-width: 0;
  margin: 0;
  font-family: var(--display);
  font-weight: 900;
  font-size: clamp(60px, 19vw, 92px);
  line-height: .82;
  letter-spacing: .02em;
  text-transform: uppercase;
}
.brand i { font-style: normal; color: var(--p1); }

.lang-wrap {
  max-width: 440px;
  min-height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 22px;
}
.lang-q { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.5; opacity: .85; text-wrap: balance; }
.lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lang-opt {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 64px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--fill);
  color: var(--chalk);
  font-size: 17px;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  min-width: 0;
}
.lang-opt .code { font-family: var(--display); font-weight: 900; font-size: 22px; color: var(--p1); min-width: 30px; }
.lang-opt[aria-pressed="true"] { border-color: var(--p1); }

.menu-wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.menu-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.tag { margin: 10px 0 0; font-size: 15px; font-weight: 600; opacity: .85; }
.lang-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 14px;
  border-radius: 999px;
  border: 2px solid var(--line);
  background: transparent;
  color: var(--chalk);
  font-weight: 700;
  cursor: pointer;
}
.lang-btn .code { font-family: var(--display); font-weight: 900; font-size: 18px; color: var(--p1); }
.sect { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .8; }
.game-secs { display: flex; flex-direction: column; gap: 24px; }
.game-sec { display: flex; flex-direction: column; gap: 10px; }
.games { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.game {
  width: 100%;
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 14px;
  text-align: left;
  color: inherit;
}
.game.live { background: var(--chalk); color: var(--ink); border: 0; cursor: pointer; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
.game.soon { background: var(--fill); border: 1px dashed var(--line); color: var(--chalk); }
.emb { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; }
.emb svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.emb svg .dot { fill: currentColor; stroke: none; }
.game.live .emb { background: var(--turf); color: var(--chalk); }
.game.soon .emb { border: 2px solid var(--line); opacity: .75; }
.g-text { min-width: 0; display: block; }
.g-name { display: block; font-family: var(--display); font-weight: 900; font-size: 24px; line-height: .95; text-transform: uppercase; letter-spacing: .01em; }
.g-desc { display: block; margin-top: 5px; font-size: 14px; line-height: 1.35; }
.g-meta { display: block; margin-top: 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.pill { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.game.live .pill { background: var(--turf); color: var(--chalk); }
.game.soon .pill { border: 1px solid var(--line); opacity: .8; }
.menu-foot { margin: 0; font-size: 12px; line-height: 1.4; opacity: .7; }

/* ---------- pitch ---------- */
.pitch {
  position: relative;
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: 1fr 1fr;
  border: 2px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  background: repeating-linear-gradient(to bottom, var(--turf) 0 52px, var(--turf-2) 52px 104px);
}
.pitch::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 2px;
  transform: translateY(-1px);
  background: var(--line);
  pointer-events: none;
  z-index: 2;
}

.kickoff {
  position: absolute;
  left: 50%; top: 50%;
  width: 104px; height: 104px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 2;
}
.kickoff svg { width: 100%; height: 100%; overflow: visible; }
.kickoff .track { fill: none; stroke: var(--line); stroke-width: 2; }
.kickoff .drain {
  fill: none; stroke: var(--chalk); stroke-width: 5; stroke-linecap: round;
  stroke-dasharray: 100; stroke-dashoffset: 0;
  transform: rotate(-90deg); transform-origin: 50% 50%;
  transition: stroke .3s;
}
.kickoff.idle .drain { stroke: var(--line); stroke-width: 2; }
.kickoff.b0 .drain { stroke: var(--p1); }
.kickoff.b1 .drain { stroke: var(--p2); }
.kickoff.low .drain { stroke: var(--bad); }
.kickoff .spot { fill: var(--chalk); }

.half {

  border: 2px solid var(--line);
  border-bottom: none;
  pointer-events: none;
}

.stage {
  position: relative;

}

.pair { display: flex; align-items: flex-start; justify-content: center; gap: 6px; width: 100%; }

}
.ask { margin: 0; font-weight: 700; font-size: 16px; text-wrap: balance; }

}

}

.label { margin: 4px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .8; }

.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.lang-opt:focus-visible, .lang-btn:focus-visible, .back:focus-visible { outline: 3px solid var(--p1); outline-offset: 3px; }

/* ---------- game intro card ---------- */
.overlay {

.chips { display: flex; gap: 8px; flex-wrap: wrap; border: 0; margin: 0; padding: 0; min-width: 0; }

.chip span {

}

.sub-legend { width: 100%; margin-top: 6px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.pool { width: 100%; margin: 2px 0 0; font-size: 13px; line-height: 1.4; color: var(--ink-soft); }

.go {
  min-height: 54px;

/* ---------- ad placeholder after a match ---------- */
.adscreen {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: var(--ad-bg);
  color: var(--chalk);
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
}
.ad-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ad-tag { padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.ad-skip {
  min-height: 40px;
  padding: 0 16px;
  border-radius: 999px;

}
.ad-skip:disabled { opacity: .7; }
.ad-skip:not(:disabled) { border-color: var(--chalk); background: var(--chalk); color: var(--ink); cursor: pointer; }

.ad-body { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.ad-media {

}

.ad-note { margin: 0; max-width: 34ch; font-size: 14px; line-height: 1.45; opacity: .85; text-wrap: balance; }
.ad-progress { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.ad-progress span { display: block; height: 100%; width: 0; background: var(--p1); }

/* ---------- solo games ---------- */
.solo-modal {
  position: fixed; inset: 0 0 var(--ad-h) 0; z-index: 40;
  display: flex; align-items: safe center; justify-content: center;
  overflow-y: auto;   /* a tall card scrolls instead of being cut off on small phones */
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(var(--sab) + 16px) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(10, 34, 22, .72);
  backdrop-filter: blur(3px);
}
.modal-card { width: 100%; max-width: 380px; }
.revive {
  position: relative; width: 150px; height: 150px; margin: 4px auto;
  border: 0; border-radius: 50%; background: var(--turf); color: var(--chalk);
  display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .25);

}
.revive svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.rv-track { fill: none; stroke: rgba(244, 242, 232, .25); stroke-width: 6; }
.rv-drain { fill: none; stroke: var(--p1); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; }
.rv-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rv-num { font-family: var(--display); font-weight: 900; font-size: 64px; line-height: .9; font-variant-numeric: tabular-nums; }
.rv-cap { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.revive:focus-visible { outline: 3px solid var(--p1); outline-offset: 4px; }
.revive:active { transform: scale(.97); }
@keyframes rvpulse { 50% { transform: scale(1.04); } }
.rv-label { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; }
.link-btn { align-self: center; padding: 6px 10px; border: 0; background: none; color: var(--ink-soft); font-weight: 700; font-size: 14px; text-decoration: underline; cursor: pointer; }
.link-btn:focus-visible { outline: 3px solid var(--p1); outline-offset: 2px; }
.solo-wrap { max-width: 520px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.solo-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.solo-stats { display: flex; gap: 16px; font-family: var(--display); text-transform: uppercase; font-weight: 800; font-size: 14px; letter-spacing: .06em; text-align: right; }

.solo-bar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.solo-bar span { display: block; height: 100%; width: 100%; background: var(--chalk); transform-origin: left center; transition: transform .1s linear; }

.solo-body { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-bottom: 8px; }

.opts { width: 100%; display: grid; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px;

}

/* ---------- Karriereweg ---------- */

  background: var(--turf-deep);
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, var(--sab)) max(16px, env(safe-area-inset-left, 0px));

.kw-half {
  --pc: var(--p1);
  position: relative; z-index: 1;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 7px;
  min-height: 0; overflow: hidden;
  padding: 12px 8px 6px;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: background-color .25s ease;
}
.kw-half[data-p="1"] { --pc: var(--p2); transform: rotate(180deg); }
.kw-half.lit { background-color: color-mix(in srgb, var(--pc) 18%, transparent); }
.kw-half.out .kw-opts { opacity: .55; }
.kw-cnt { margin-left: 8px; font-size: 13px; letter-spacing: .08em; color: var(--chalk); opacity: .7; font-variant-numeric: tabular-nums; }
.kw-hmain { min-height: 0; flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; }
.kw-path.compact { gap: 4px; }
.kw-path.compact .kw-st { min-height: 30px; padding: 3px 6px; gap: 6px; border-radius: 8px; }
.kw-path.compact .kw-no { min-width: 12px; font-size: 12px; }
.kw-path.compact .kw-badge { width: 22px; height: 22px; font-size: 8px; box-shadow: 0 0 0 1.5px var(--chalk); }
.kw-path.compact .kw-badge.q { font-size: 11px; }
.kw-path.compact .kw-txt { flex-direction: row; align-items: baseline; gap: 6px; }
.kw-path.compact .kw-txt b { flex: 1; min-width: 0; font-size: 13px; -webkit-line-clamp: 1; }
.kw-path.compact .kw-txt small { flex: none; font-size: 11px; }
/* two columns in a half: the club name gets the whole width, the years go underneath */
.kw-path.compact.two .kw-st { min-height: 32px; padding: 2px 6px 2px 4px; gap: 5px; }
.kw-path.compact.two .kw-no { min-width: 10px; font-size: 11px; }
.kw-path.compact.two .kw-txt { flex-direction: column; align-items: stretch; gap: 0; }
.kw-path.compact.two .kw-txt b { display: block; white-space: nowrap; text-overflow: ellipsis; overflow-wrap: normal; font-size: 13px; line-height: 1.15; }
.kw-path.compact.two .kw-txt small { font-size: 10.5px; line-height: 1.2; white-space: nowrap; }
.kw-path.compact .kw-loan { margin-left: 3px; padding: 0 3px; font-size: 8px; }
/* denser steps for small phones, chosen in kwFit:
   d1 two lines but tighter, d2 one line with short years, d3 one line without years, d4 like d3 but scrollable */
.kw-path.compact.d1 { gap: 2px; }
.kw-path.compact.d2, .kw-path.compact.d3, .kw-path.compact.d4 { gap: 3px; }
.kw-path.compact.d1 .kw-st { min-height: 28px; padding: 1px 5px 1px 4px; gap: 5px; }
.kw-path.compact.d1 .kw-no { min-width: 10px; font-size: 11px; }
.kw-path.compact.d1 .kw-badge { width: 20px; height: 20px; font-size: 7.5px; }
.kw-path.compact.d1 .kw-txt { flex-direction: column; align-items: stretch; gap: 0; }
.kw-path.compact.d1 .kw-txt small { font-size: 9.5px; line-height: 1.1; white-space: nowrap; }
.kw-path.compact.d1 .kw-loan { font-size: 7px; vertical-align: 1px; }
.kw-path.compact.d1 .kw-txt b, .kw-path.compact.d2 .kw-txt b, .kw-path.compact.d3 .kw-txt b, .kw-path.compact.d4 .kw-txt b {
  flex: 1; min-width: 0; display: block; white-space: nowrap; text-overflow: ellipsis; overflow-wrap: normal; font-size: 12.5px; line-height: 1.1;
}
.kw-path.compact.d2 .kw-st { min-height: 26px; padding: 1px 5px 1px 4px; gap: 5px; }
.kw-path.compact.d2 .kw-badge { width: 20px; height: 20px; font-size: 7.5px; }
.kw-path.compact.d2 .kw-txt, .kw-path.compact.d3 .kw-txt, .kw-path.compact.d4 .kw-txt { flex-direction: row; align-items: center; gap: 5px; }
.kw-path.compact.d2 .yl, .kw-path.compact.d3 .yl, .kw-path.compact.d4 .yl { display: none; }
.kw-path.compact.d2 .ys { display: inline; }
.kw-path.compact.d2 .kw-loan, .kw-path.compact.d3 .kw-loan, .kw-path.compact.d4 .kw-loan { font-size: 7px; padding: 0 2px; }
.kw-path.compact.d3 .kw-st, .kw-path.compact.d4 .kw-st { min-height: 22px; padding: 1px 5px 1px 3px; gap: 4px; }
.kw-path.compact.d3 .kw-badge, .kw-path.compact.d4 .kw-badge { width: 18px; height: 18px; font-size: 7px; box-shadow: 0 0 0 1px var(--chalk); }
.kw-hmain:has(> .kw-path.d4) { justify-content: flex-start; overflow-y: auto; }
.kw-path.compact.roomy { gap: 5px; }
.kw-path.compact.roomy .kw-st { min-height: 40px; padding: 3px 8px 3px 6px; gap: 7px; border-radius: 9px; }
.kw-path.compact.roomy .kw-no { min-width: 12px; font-size: 13px; }
.kw-path.compact.roomy .kw-badge { width: 27px; height: 27px; font-size: 9px; box-shadow: 0 0 0 1.5px var(--chalk); }
.kw-path.compact.roomy .kw-txt { flex-direction: column; align-items: stretch; gap: 1px; }
.kw-path.compact.roomy .kw-txt b { flex: none; display: block; white-space: nowrap; text-overflow: ellipsis; overflow-wrap: normal; font-size: 14px; line-height: 1.15; }
.kw-path.compact.roomy .kw-txt small { font-size: 11px; line-height: 1.15; white-space: nowrap; }
.kw-path.compact.roomy .kw-loan { font-size: 8px; }

/* solo: the name is typed; the screen follows the visible area so the field stays above the keyboard */
#careerScreen.kw-solo-on {
  top: var(--kw-vt, 0px); bottom: auto; height: calc(var(--kw-vh, 100%) - var(--ad-h));
  overflow: hidden;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(var(--sab) + 12px);
}
#careerScreen.kw-solo-on.kw-kb { padding-top: 10px; padding-bottom: 8px; }
.kw-solo-on #kwSolo { height: 100%; min-height: 0; gap: 10px; }
.kw-solo-on .kw-body { min-height: 0; gap: 10px; padding-bottom: 0; }
.kw-main { flex: 1 1 0; min-height: 0; width: 100%; display: flex; flex-direction: column; position: relative; }
.kw-st.next { opacity: 1; border-style: solid; border-color: var(--chalk); background: color-mix(in srgb, var(--chalk) 10%, transparent); cursor: pointer; }
.kw-st.next .kw-badge.q { border-style: solid; border-color: var(--chalk); font-weight: 900; }
.kw-st.next .kw-txt b { color: var(--chalk); }
.kw-st.next:active { transform: translateY(1px); }
.kw-st.next:focus-visible { outline: 3px solid var(--p1); outline-offset: 2px; }
#careerScreen.kw-kb #kwKick { display: none; }
#careerScreen.kw-kb .kw-body, #careerScreen.kw-kb #kwSolo { gap: 8px; }
.kw-main:has(> .kw-path.d4) { overflow-y: auto; }
.kw-tools { min-height: 44px; }
.kw-tools { flex-wrap: nowrap; }
.kw-tools .kw-pts { font-size: 18px; white-space: nowrap; }
.kw-tools.res { justify-content: center; gap: 12px; }
.kw-tools.res .fb-title { font-size: 26px; white-space: nowrap; }
.kw-tools.res .kw-was { min-width: 0; text-align: left; line-height: 1.2; }
.kw-guess { width: 100%; display: flex; gap: 8px; }
.kw-input {
  flex: 1; min-width: 0; height: 52px; padding: 0 14px;
  border-radius: 12px; border: 2px solid var(--chalk);
  background: var(--chalk); color: var(--ink);
  font: inherit; font-size: 18px; font-weight: 700;
}
.kw-input::placeholder { color: var(--ink-soft); font-weight: 600; opacity: 1; }
.kw-input:focus { outline: 3px solid var(--p1); outline-offset: 2px; }
.kw-input.shake { animation: kwShake .35s ease; border-color: var(--bad); }
@keyframes kwShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.kw-send {
  flex: none; height: 52px; padding: 0 16px; border: 0; border-radius: 12px;
  background: var(--p1); color: var(--ink);
  font-family: var(--display); font-weight: 900; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
}
.kw-send:active { transform: translateY(1px); }
.kw-send:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.kw-hint { width: 100%; min-height: 20px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-align: left; }
.kw-hint .msg { min-width: 0; }
.kw-hint .msg.bad { color: var(--bad); }
.kw-give { flex: none; margin-left: auto; padding: 4px 2px; border: 0; background: none; color: var(--chalk); opacity: .85; font-weight: 700; font-size: 14px; text-decoration: underline; cursor: pointer; }
.kw-give:focus-visible { outline: 3px solid var(--p1); outline-offset: 2px; }

.kw-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: color-mix(in srgb, var(--ink) 9%, transparent); }
.kw-modes button {
  min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--ink); cursor: pointer;
  font-family: var(--display); font-weight: 900; font-size: 18px; letter-spacing: .04em; text-transform: uppercase;
}
.kw-modes button[aria-checked="true"] { background: var(--turf); color: var(--chalk); }
.kw-modes button:focus-visible { outline: 3px solid var(--p1); outline-offset: 2px; }
.kw-pick { margin: 2px 0 -4px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.kw-diffs button { min-height: 40px; font-size: 16px; }
.kw-sact { --pc: var(--p1); width: 100%; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.kw-sact .kw-buzz { min-height: 100px; }
.kw-sact .kw-snext { width: 100%; }
.kw-left { font-family: var(--display); font-weight: 900; font-size: 18px; color: var(--bad); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* duel: the half is a buzzer, the other player judges */
.kw-half { cursor: pointer; }
.kw-act { min-height: 118px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.kw-buzz {
  width: 100%; min-height: 84px; border-radius: 18px;
  border: 3px solid var(--pc); background: color-mix(in srgb, var(--pc) 22%, transparent);
  color: var(--chalk); cursor: pointer;
  font-family: var(--display); font-weight: 900; font-size: 30px; letter-spacing: .05em; text-transform: uppercase;
}
.kw-buzz:active { background: color-mix(in srgb, var(--pc) 42%, transparent); }
.kw-buzz:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.kw-cd { margin: 0; font-family: var(--display); font-weight: 900; font-size: 46px; line-height: .9; color: var(--pc); font-variant-numeric: tabular-nums; }
.kw-say { margin: 0; font-weight: 700; font-size: 16px; line-height: 1.25; }
.kw-name { margin: 0; font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }
.kw-judge { width: 100%; display: flex; gap: 8px; }
.kw-judge button {
  flex: 1; min-height: 50px; border: 0; border-radius: 12px; color: var(--ink); cursor: pointer;
  font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: .04em; text-transform: uppercase;
}
.kw-judge button:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.kw-yes { background: var(--good); }
.kw-nope { background: var(--bad); }
.kw-mini.ghost { background: transparent; color: var(--chalk); }
.kw-hres { width: 100%; }
.kw-hres .badc { color: var(--bad); font-family: var(--display); font-size: 19px; font-weight: 900; text-transform: uppercase; }
.kw-hres .good { font-size: 19px; }
.kw-half.wait .kw-hmain { opacity: .8; }
.kw-path.compact .kw-ph { height: 8px; }
.kw-path .ys { display: none; }
.kw-hask { margin: 0; min-height: 36px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; font-size: 15px; line-height: 1.2; }
.kw-hask.out { font-size: 14px; }
.kw-hask b { color: var(--pc); font-family: var(--display); font-weight: 900; letter-spacing: .03em; text-transform: uppercase; margin-left: 4px; }
.kw-hask.out { color: var(--bad); }
.kw-hres { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }
.kw-hres p { margin: 0; font-weight: 700; font-size: 15px; text-align: left; }
.kw-hres .good { color: var(--good); font-family: var(--display); font-size: 22px; font-weight: 900; text-transform: uppercase; }
.kw-mini {
  flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px;
  border: 2px solid var(--chalk); background: var(--chalk); color: var(--ink);
  font-family: var(--display); font-weight: 800; font-size: 16px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer;
}
.kw-half .kw-opts { gap: 6px; }
.kw-half .kw-opts .opt { min-height: 44px; padding: 6px 8px; font-size: 14px; justify-content: center; text-align: center; }
.kw-hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 0; font-family: var(--display); text-transform: uppercase; }
.kw-tally { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 18px; }
.kw-tally b { font-size: 28px; font-weight: 900; color: var(--pc); line-height: 1; }
.kw-tally small { font-size: 12px; letter-spacing: .1em; opacity: .7; }
.kw-end { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.kw-end-title { margin: 0; font-family: var(--display); font-weight: 900; font-size: 44px; line-height: .9; text-transform: uppercase; color: var(--pc); }
.kw-end-score { margin: 0; font-weight: 700; font-size: 16px; }
.kw-end-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.kw-quit {
  position: absolute; right: 6px; top: 50%; z-index: 3; transform: translateY(-50%);
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--turf-deep); color: var(--chalk);
  font-size: 18px; line-height: 1; cursor: pointer;
}
.kw-quit:focus-visible { outline: 3px solid var(--p1); outline-offset: 2px; }
@media (max-height: 700px) {
  .kw-half { gap: 5px; padding-top: 8px; }
  .kw-act { min-height: 104px; }
  .kw-buzz { min-height: 68px; font-size: 26px; }
  .kw-name { font-size: 24px; }
}
@media (max-width: 340px) {
  .kw-path.two:not(.compact) { grid-template-columns: minmax(0, 1fr); grid-auto-flow: row; grid-template-rows: none !important; }
}
@media (prefers-reduced-motion: reduce) { .kw-st.new { animation: none; } }

/* ---------- menu: three categories first ---------- */
.cats { display: flex; flex-direction: column; gap: 12px; }
.cat {
  width: 100%; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 14px;
  padding: 18px 16px; border-radius: 16px; border: 0; text-align: left; cursor: pointer;
  background: var(--chalk); color: var(--ink); box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
}
.cat .emb { width: 56px; height: 56px; background: var(--turf); color: var(--chalk); }
.cat-video .emb { background: #c8102e; }
.cat .g-name { font-size: 30px; }
.cat-arrow { font-family: var(--display); font-weight: 900; font-size: 30px; color: var(--turf); }
.cat:active { transform: translateY(1px); }
.cat:focus-visible { outline: 3px solid var(--p1); outline-offset: 3px; }
.cat-head { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.cat-title { margin: 0; font-family: var(--display); font-weight: 900; font-size: 40px; line-height: .9; text-transform: uppercase; }
.cat-hint { margin: 0; font-size: 14px; line-height: 1.4; opacity: .85; }

/* ---------- Video-Battle ---------- */
.vb-screen .vb-wrap { max-width: 520px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; }
.vb-card { margin: 0 auto; }
.vb-title { font-size: clamp(38px, 11vw, 52px); }
.vb-opt { display: flex; flex-direction: column; gap: 8px; }
.vb-leg { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.vb-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.vb-chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--ink);
  background: transparent; color: var(--ink); cursor: pointer;
  font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: .04em; text-transform: uppercase;
}
.vb-chip[aria-pressed="true"] { background: var(--ink); color: var(--chalk); }
.vb-chip:focus-visible { outline: 3px solid var(--p1); outline-offset: 2px; }
.vb-pool { margin: 0; font-size: 13px; color: var(--ink-soft); }
.vb-names { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.vb-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.vb-field span { font-size: 12px; font-weight: 700; }
.vb-field input {
  width: 100%; min-width: 0; height: 50px; padding: 0 12px; border-radius: 10px;
  border: 2px solid var(--ink); background: #fff; color: var(--ink);
  font: inherit; font-size: 18px; font-weight: 700;
}
.vb-field.p0 input { box-shadow: inset 0 -5px 0 var(--p1); }
.vb-field.p1 input { box-shadow: inset 0 -5px 0 var(--p2); }
.vb-field input:focus { outline: 3px solid var(--turf); outline-offset: 1px; }

.vb-screen.playing { overflow: hidden; padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: calc(var(--sab) + 12px); }
.vb-screen.playing .vb-wrap { height: 100%; justify-content: flex-start; }
.vb-play { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.vb-top { display: flex; align-items: center; gap: 10px; }
.vb-brand { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.vb-brand i { font-style: normal; color: var(--p1); }
.vb-mode { flex: 1; min-width: 0; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vb-x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: transparent; color: var(--chalk); font-size: 18px; line-height: 1; cursor: pointer; }
.vb-x:focus-visible, .vb-name:focus-visible, .vb-none:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.vb-board {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px;
  padding: 10px 14px; border-radius: 16px; background: rgba(0, 0, 0, .24);
}
.vb-team { display: flex; align-items: center; gap: 10px; min-width: 0; }
.vb-team.p1 { justify-content: flex-end; }
.vb-tn { min-width: 0; font-family: var(--display); font-weight: 900; font-size: 22px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vb-team.p0 .vb-tn { color: var(--p1); }
.vb-team.p1 .vb-tn { color: var(--p2); }
.vb-team b { font-family: var(--display); font-weight: 900; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
.vb-team.lit b { animation: vbPop .5s ease; }
.vb-sep { font-family: var(--display); font-weight: 900; font-size: 32px; opacity: .6; }
@keyframes vbPop { 40% { transform: scale(1.4); } }
.vb-round { margin: 0; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.vb-main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px; text-align: center; }
.vb-play.st-result .vb-main { overflow-y: auto; }
.vb-nm { white-space: nowrap; }
.vb-name.wrap .vb-nm, .vb-end-name.wrap .vb-nm { white-space: normal; }
.vb-count-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.vb-count { margin: 0; font-family: var(--display); font-weight: 900; font-size: min(52vw, 240px); line-height: .85; color: var(--p1); animation: vbCount .8s ease-out; }
@keyframes vbCount { from { transform: scale(1.7); opacity: 0; } 35% { opacity: 1; } }
.vb-ready { margin: 0; font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
.vb-q { width: 100%; animation: vbIn .35s ease-out; }
.vb-q .crest { width: clamp(96px, 30vw, 140px); font-size: clamp(28px, 9vw, 40px); }
.vb-q .club figcaption { font-size: 20px; }
.vb-q.done .crest { width: clamp(72px, 22vw, 100px); font-size: clamp(22px, 7vw, 30px); }
@keyframes vbIn { from { transform: scale(.9); opacity: 0; } }
.vb-ask { margin: 0; font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1.05; text-transform: uppercase; letter-spacing: .03em; }
.vb-sol-label { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.vb-sol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 8px; }
.vb-sol li { padding: 5px 12px; border-radius: 999px; background: var(--fill); font-weight: 700; font-size: 15px; }
.vb-path { flex: 1 1 0; min-height: 0; width: 100%; display: flex; flex-direction: column; justify-content: center; }
.vb-path:has(> .kw-path.d4) { overflow-y: auto; justify-content: flex-start; }
.vb-answer { margin: 0; font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; text-transform: uppercase; color: var(--good); }
.vb-foot { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; gap: 8px; min-height: 150px; }
.vb-tap { margin: 0; text-align: center; font-size: 13px; font-weight: 600; opacity: .8; }
.vb-btns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.vb-name {
  min-height: 84px; padding: 8px 10px; border: 0; border-radius: 16px; color: var(--ink); cursor: pointer;
  font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .02em;
  overflow-wrap: anywhere; box-shadow: 0 6px 0 rgba(0, 0, 0, .28);
}
.vb-name.p0 { background: var(--p1); }
.vb-name.p1 { background: var(--p2); }
.vb-name:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0, 0, 0, .28); }
.vb-none { align-self: center; min-height: 40px; padding: 0 16px; border: 0; background: none; color: var(--chalk); font-weight: 700; font-size: 15px; text-decoration: underline; cursor: pointer; opacity: .85; }
.vb-judge-q { margin: 0; text-align: center; font-family: var(--display); font-weight: 900; font-size: 24px; line-height: 1.1; text-transform: uppercase; overflow-wrap: anywhere; }
.vb-judge-q b.p0 { color: var(--p1); }
.vb-judge-q b.p1 { color: var(--p2); }
.vb-verdict {
  min-height: 72px; padding: 8px 10px; border: 0; border-radius: 16px; color: var(--ink); cursor: pointer;
  font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1; text-transform: uppercase; letter-spacing: .02em;
  box-shadow: 0 6px 0 rgba(0, 0, 0, .28);
}
.vb-verdict.ok { background: var(--good); }
.vb-verdict.bad { background: var(--bad); }
.vb-verdict:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0, 0, 0, .28); }
.vb-verdict:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.vb-play.st-judge .vb-main { overflow: hidden; gap: 8px; }
.vb-play.st-judge .vb-q .crest { width: clamp(52px, 15vw, 70px); font-size: clamp(16px, 4.6vw, 21px); }
.vb-play.st-judge .vb-q .club figcaption { font-size: 15px; }
.vb-verdict { white-space: nowrap; }
@media (max-width: 360px) { .vb-verdict { font-size: 20px; padding: 8px 6px; } }
.vb-sol.all { flex: 0 1 auto; min-height: 0; overflow-y: auto; align-content: flex-start; }
.vb-res { margin: 0; text-align: center; font-family: var(--display); font-weight: 900; font-size: 36px; line-height: 1; text-transform: uppercase; }
.vb-res.p0 { color: var(--p1); }
.vb-res.p1 { color: var(--p2); }
.vb-next { width: 100%; min-height: 60px; font-size: 26px; }
.vb-end { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.vb-end-name { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(48px, 16vw, 84px); line-height: .9; text-transform: uppercase; overflow-wrap: anywhere; }
.vb-end-name.p0 { color: var(--p1); }
.vb-end-name.p1 { color: var(--p2); }
.vb-end-wins { margin: 0; font-family: var(--display); font-weight: 900; font-size: 32px; text-transform: uppercase; }
.vb-end-score { margin: 0; font-family: var(--display); font-weight: 900; font-size: 60px; line-height: 1; font-variant-numeric: tabular-nums; }
.vb-end-actions { display: flex; flex-direction: column; gap: 10px; }
.vb-end-actions .btn { width: 100%; }
@media (max-height: 700px) {
  .vb-name { min-height: 66px; font-size: 24px; }
  .vb-foot { min-height: 120px; }
  .vb-team b { font-size: 36px; }
  .vb-q .crest { width: clamp(80px, 24vw, 110px); }
}
@media (max-height: 620px) {
  .vb-play { gap: 6px; }
  .vb-brand { font-size: 24px; }
  .vb-x { width: 34px; height: 34px; font-size: 15px; }
  .vb-board { padding: 6px 12px; }
  .vb-team b { font-size: 30px; }
  .vb-tn { font-size: 18px; }
  .vb-main { gap: 8px; }
  .vb-q .crest { width: clamp(64px, 20vw, 88px); font-size: clamp(20px, 6vw, 26px); }
  .vb-q .club figcaption { font-size: 15px; }
  .vb-q.done .crest { width: 54px; font-size: 16px; }
  .vb-ask { font-size: 21px; }
  .vb-sol li { padding: 3px 10px; font-size: 13px; }
  .vb-answer { font-size: 28px; }
  .vb-res { font-size: 26px; }
  .vb-next { min-height: 50px; font-size: 22px; }
  .vb-name { min-height: 56px; font-size: 22px; }
  .vb-verdict { min-height: 54px; font-size: 22px; }
  .vb-judge-q { font-size: 19px; }
  .vb-foot { min-height: 96px; gap: 6px; }
  .vb-none { min-height: 34px; }
}
@media (prefers-reduced-motion: reduce) { .vb-count, .vb-q, .vb-team.lit b { animation: none; } }

/* ---------- banner ad (placeholder for a standard 320 × 50 banner) ---------- */
.banner {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  height: var(--ad-h); padding-bottom: env(safe-area-inset-bottom, 0px);
  display: none; justify-content: center; align-items: stretch;
  background: var(--ad-bg); border-top: 1px solid var(--line);
}
html.has-banner .banner { display: flex; }
html.has-banner.kb-open .banner { display: none; }
.banner-slot {
  width: 320px; max-width: 100%; height: 50px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  border-inline: 1px dashed var(--line); color: var(--chalk);
}
.banner-tag { padding: 2px 6px; border: 1px solid var(--line); border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.banner-txt { font-size: 13px; font-weight: 600; opacity: .6; }
/* in the Android app the real banner is drawn by Google on top of this strip */
html.native .banner-slot { visibility: hidden; }
/* public browser version: a hint to the apps instead of an ad */
html.web { --banner-h: calc(34px + var(--anchor-h, 0px)); }
html.web:not(.has-banner) { --ad-h: var(--anchor-h, 0px); }
html.web .banner { align-items: flex-start; }
html.web .banner-tag { display: none; }
html.web .banner-slot { width: auto; height: 34px; padding: 0 16px; border-inline: 0; text-align: center; text-decoration: none; }
html.web .banner-txt { font-size: 12.5px; opacity: .85; line-height: 1.25; }
html.web .banner-txt::before { content: "📲 "; }
html.web a.banner-slot .banner-txt { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
html.native:not(.ad-live) .banner { border-top: 0; }
/* "Info & Rechtliches": one row at the bottom of the start page, opens a sheet */
.info-btn {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; margin-top: -4px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--fill); color: var(--chalk);
  font: inherit; font-weight: 700; font-size: 15px; text-align: left; cursor: pointer;
}
.info-btn .info-i { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--chalk); font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 16px; line-height: 1; }
.info-btn .info-go { margin-left: auto; font-family: var(--display); font-weight: 900; font-size: 22px; opacity: .8; }
.info-btn:focus-visible, .info-row:focus-visible, .info-x:focus-visible { outline: 3px solid var(--p1); outline-offset: 2px; }
.info-sheet {
  position: fixed; inset: 0 0 var(--ad-h) 0; z-index: 41;
  display: flex; align-items: flex-end; justify-content: center; overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(var(--sab) + 16px) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(10, 34, 22, .72); backdrop-filter: blur(3px);
}
.info-card { width: 100%; max-width: 420px; padding: 18px 16px 14px; border-radius: 18px; background: var(--chalk); color: var(--ink); box-shadow: 0 18px 50px rgba(0, 0, 0, .45); }
.info-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.info-title { margin: 0; font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; text-transform: uppercase; }
.info-x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink-line); background: transparent; color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; }
.info-list { display: flex; flex-direction: column; }
.info-row {
  display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 8px 2px;
  border: 0; border-top: 1px solid var(--ink-line); background: none; color: var(--ink);
  font: inherit; font-weight: 700; font-size: 16px; text-align: left; text-decoration: none; cursor: pointer;
}
.info-row:first-child { border-top: 0; }
.info-row .info-val { margin-left: auto; font-weight: 600; font-size: 14px; color: var(--ink-soft); }
.info-row .info-go { font-family: var(--display); font-weight: 900; font-size: 20px; color: var(--turf); }
.info-row.off { cursor: default; opacity: .5; }
.info-ver { margin: 10px 0 0; font-size: 12px; color: var(--ink-soft); text-align: center; }
</style>
</head>
<body>

<!-- Game: Doppelpass -->
<main class="pitch" id="pitch">
  <section class="half" data-p="1"></section>
  <section class="half" data-p="0"></section>
  <div class="kickoff idle" id="kickoff" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="48"></circle>
      <circle class="drain" id="drain" cx="50" cy="50" r="48" pathLength="100"></circle>
      <circle class="spot" cx="50" cy="50" r="3.5"></circle>
    </svg>
  </div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-labelledby="game-title">
    <button class="back" id="back" type="button"><span aria-hidden="true">←</span><span data-t="games"></span></button>
    <p class="eyebrow" data-t="eyebrow"></p>
    <h2 class="title" id="game-title"><span data-t="title1"></span><span data-t="title2"></span></h2>
    <ol class="rules">
      <li data-t="rule1"></li>
      <li data-t="rule2"></li>
      <li data-t="rule3"></li>
    </ol>
    <fieldset class="chips qtypes">
      <legend data-t="types"></legend>
      <label class="chip"><input type="checkbox" name="qtype" id="qt-cc" value="cc"><span data-t="tCC"></span></label>
      <label class="chip"><input type="checkbox" name="qtype" id="qt-cn" value="cn"><span data-t="tCN"></span></label>
      <label class="chip"><input type="checkbox" name="qtype" id="qt-cp" value="cp"><span data-t="tCP"></span></label>
      <p class="pool" id="typeInfo"></p>
    </fieldset>
    <fieldset class="chips levels">
      <legend data-t="level"></legend>
      <label class="chip"><input type="radio" name="level" id="lv-1" value="1"><span data-t="lv1"></span></label>
      <label class="chip"><input type="radio" name="level" id="lv-2" value="2"><span data-t="lv2"></span></label>
      <label class="chip"><input type="radio" name="level" id="lv-3" value="3"><span data-t="lv3"></span></label>
      <label class="chip bk"><input type="radio" name="level" id="lv-4" value="4"><span data-t="lv4"></span></label>
      <p class="pool" id="levelInfo"></p>
    </fieldset>
    <fieldset class="chips leagues">
      <legend data-t="leagues"></legend>
      <label class="chip"><input type="checkbox" name="league" id="lg-bl" value="bl"><span>Bundesliga</span></label>
      <label class="chip"><input type="checkbox" name="league" id="lg-pl" value="pl"><span>Premier League</span></label>
      <label class="chip"><input type="checkbox" name="league" id="lg-ll" value="ll"><span>La Liga</span></label>
      <label class="chip"><input type="checkbox" name="league" id="lg-sa" value="sa"><span>Serie A</span></label>
      <label class="chip"><input type="checkbox" name="league" id="lg-l1" value="l1"><span>Ligue 1</span></label>
      <span class="sub-legend" data-t="moreLeagues"></span>
      <label class="chip"><input type="checkbox" name="league" id="lg-tsl" value="tsl"><span>Süper Lig</span></label>
      <label class="chip"><input type="checkbox" name="league" id="lg-ere" value="ere"><span>Eredivisie</span></label>
      <label class="chip"><input type="checkbox" name="league" id="lg-mls" value="mls"><span>MLS</span></label>
      <label class="chip"><input type="checkbox" name="league" id="lg-bl2" value="bl2"><span>2. Bundesliga</span></label>
      <p class="pool" id="poolInfo" aria-live="polite"></p>
    </fieldset>
    <fieldset class="chips">
      <legend data-t="target"></legend>
      <label class="chip"><input type="radio" name="target" id="t5" value="5" checked><span data-t="pts" data-n="5"></span></label>
      <label class="chip"><input type="radio" name="target" id="t7" value="7"><span data-t="pts" data-n="7"></span></label>
      <label class="chip"><input type="radio" name="target" id="t10" value="10"><span data-t="pts" data-n="10"></span></label>
    </fieldset>
    <button class="go" id="go" type="button" data-t="go"></button>
    <p class="foot" data-t="foot"></p>
  </div>
</div>

<!-- Solo: Serie and Tagesrätsel -->
<div class="screen" id="soloScreen" hidden>
  <div class="solo-wrap">
    <header class="solo-head">
      <button class="lang-btn" id="soloBack" type="button"><span aria-hidden="true">←</span><span data-t="games"></span></button>
      <div class="solo-stats" id="soloStats"></div>
    </header>
    <div class="solo-bar" id="soloBarWrap"><span id="soloBar"></span></div>
    <div class="solo-body" id="soloBody"></div>
  </div>
  <div class="solo-modal" id="soloModal" hidden>
    <div class="modal-card" id="soloModalCard" role="dialog" aria-modal="true"></div>
  </div>
</div>

<!-- Game: Karriereweg (alone or two players on one phone) -->
<div class="screen" id="careerScreen" hidden>
  <div class="solo-wrap" id="kwSolo">
    <header class="solo-head">
      <button class="lang-btn" id="kwBack" type="button"><span aria-hidden="true">←</span><span data-t="games"></span></button>
      <div class="solo-stats" id="kwStats"></div>
    </header>
    <div class="kw-body" id="kwBody" hidden>
      <p class="solo-kicker" id="kwKick"></p>
      <div class="kw-main" id="kwMain"></div>
      <div class="kw-tools" id="kwTools"></div>
      <form class="kw-guess" id="kwForm" autocomplete="off" novalidate>
        <input class="kw-input" id="kwInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" maxlength="40">
        <button class="kw-send" id="kwSend" type="submit" data-keep></button>
      </form>
      <div class="kw-hint" id="kwHint" aria-live="polite"></div>
      <div class="kw-sact" id="kwSAct" hidden></div>
    </div>
  </div>
  <div class="kw-duel" id="kwDuel" hidden>
    <div class="pitch kw-pitch">
      <section class="kw-half" data-p="1"></section>
      <section class="kw-half" data-p="0"></section>
      <button class="kw-quit" id="kwQuit" type="button"><span aria-hidden="true">✕</span></button>
    </div>
  </div>
  <div class="solo-modal" id="kwModal" hidden>
    <div class="modal-card" id="kwModalCard" role="dialog" aria-modal="true"></div>
  </div>
</div>

<!-- Video-Battle: one screen for two friends, made to be filmed -->
<div class="screen vb-screen" id="vbScreen" hidden>
  <div class="vb-wrap" id="vbWrap"></div>
</div>

<!-- Games list -->
<div class="screen" id="menuScreen" hidden>
  <div class="menu-wrap">
    <header class="menu-head">
      <div>
        <h1 class="brand">Der<i>by</i></h1>
        <p class="tag" data-t="tagline"></p>
      </div>
      <button class="lang-btn" id="langBtn" type="button"></button>
    </header>
    <div class="game-secs" id="gameList"></div>
    <p class="menu-foot" data-t="menuFootApp"></p>
    <button class="info-btn" id="infoBtn" type="button"><span class="info-i" aria-hidden="true">i</span><span data-t="infoBtn"></span><span class="info-go" aria-hidden="true">→</span></button>
  </div>
</div>

<!-- Language -->
<div class="screen" id="langScreen" hidden>
  <div class="lang-wrap">
    <p class="brand" aria-hidden="true">Der<i>by</i></p>
    <h1 class="lang-q">Sprache · Language · Dil · Idioma · Langue · Lingua</h1>
    <div class="lang-grid">
      <button class="lang-opt" type="button" data-lang="de" lang="de"><span class="code">DE</span><span>Deutsch</span></button>
      <button class="lang-opt" type="button" data-lang="en" lang="en"><span class="code">EN</span><span>English</span></button>
      <button class="lang-opt" type="button" data-lang="tr" lang="tr"><span class="code">TR</span><span>Türkçe</span></button>
      <button class="lang-opt" type="button" data-lang="es" lang="es"><span class="code">ES</span><span>Español</span></button>
      <button class="lang-opt" type="button" data-lang="fr" lang="fr"><span class="code">FR</span><span>Français</span></button>
      <button class="lang-opt" type="button" data-lang="it" lang="it"><span class="code">IT</span><span>Italiano</span></button>
    </div>
  </div>
</div>

<!-- Ad placeholder shown after a match -->
<div class="adscreen" id="adScreen" role="dialog" aria-modal="true" aria-labelledby="adTag" tabindex="-1" hidden>
  <div class="ad-top">
    <span class="ad-tag" id="adTag"></span>
    <button class="ad-skip" id="adBtn" type="button" disabled></button>
  </div>
  <div class="ad-body">
    <div class="ad-media"><b id="adMediaLabel"></b></div>
    <p class="ad-note" id="adNote"></p>
  </div>
  <div class="ad-progress"><span id="adBar"></span></div>
</div>

<!-- Info & legal: language, ad privacy choices, privacy policy, legal notice -->
<div class="info-sheet" id="infoSheet" role="dialog" aria-modal="true" aria-labelledby="infoTitle" hidden>
  <div class="info-card">
    <div class="info-top">
      <h2 class="info-title" id="infoTitle" data-t="infoTitle"></h2>
      <button class="info-x" id="infoClose" type="button"><span aria-hidden="true">✕</span></button>
    </div>
    <div class="info-list" id="infoList"></div>
    <p class="info-ver" id="infoVer"></p>
  </div>
</div>

<!-- Banner ad at the bottom of the menu and of every game -->
<aside class="banner" id="adBanner">
  <div class="banner-slot"><span class="banner-tag" data-t="adLabel"></span><span class="banner-txt" data-t="adBanner"></span></div>
</aside>

<script>

/* ---------- national teams (flags simplified, drawn in a 30 × 30 box) ---------- */
function starPts(cx, cy, r, inner = 0.42) {
  const pts = [];
  for (let k = 0; k < 10; k++) {
    const ang = (-90 + k * 36) * Math.PI / 180;
    const rr = k % 2 ? r * inner : r;
    pts.push((cx + rr * Math.cos(ang)).toFixed(2) + "," + (cy + rr * Math.sin(ang)).toFixed(2));
  }
  return pts.join(" ");
}
const fStar = (cx, cy, r, fill) => `<polygon points="${starPts(cx, cy, r)}" fill="${fill}"/>`;
const fPenta = (cx, cy, r, stroke) => {
  const p = [0, 2, 4, 1, 3].map(k => {
    const a = (-90 + k * 72) * Math.PI / 180;
    return (cx + r * Math.cos(a)).toFixed(2) + "," + (cy + r * Math.sin(a)).toFixed(2);
  }).join(" ");
  return `<polygon points="${p}" fill="none" stroke="${stroke}" stroke-width="1.3"/>`;
};
const fH = (...c) => c.map((col, i) => `<rect x="0" y="${(30 / c.length * i).toFixed(2)}" width="30" height="${(30 / c.length + 0.3).toFixed(2)}" fill="${col}"/>`).join("");
const fV = (...c) => c.map((col, i) => `<rect x="${(30 / c.length * i).toFixed(2)}" y="0" width="${(30 / c.length + 0.3).toFixed(2)}" height="30" fill="${col}"/>`).join("");
const fBg = col => `<rect width="30" height="30" fill="${col}"/>`;
const fNordic = (bg, cross, inner) => inner
  ? fBg(bg) + `<rect x="7.5" width="7" height="30" fill="${cross}"/><rect y="11.5" width="30" height="7" fill="${cross}"/><rect x="9.25" width="3.5" height="30" fill="${inner}"/><rect y="13.25" width="30" height="3.5" fill="${inner}"/>`
  : fBg(bg) + `<rect x="8.5" width="5" height="30" fill="${cross}"/><rect y="12.5" width="30" height="5" fill="${cross}"/>`;
const fCrescent = fill => `<path d="M19.5,11.03 A6,6 0 1,0 19.5,18.97 A4.8,4.8 0 1,1 19.5,11.03 Z" fill="${fill}"/>`;
const fCross = (bg, col) => fBg(bg) + `<rect x="12.5" width="5" height="30" fill="${col}"/><rect y="12.5" width="30" height="5" fill="${col}"/>`;
const fChecker = () => {
  let s = "";
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++)
    s += `<rect x="${10.5 + c * 3}" y="${9.5 + r * 3}" width="3" height="3" fill="${(r + c) % 2 ? "#ffffff" : "#ff0000"}"/>`;
  return s + `<rect x="10.5" y="9.5" width="9" height="9" fill="none" stroke="#171796" stroke-width="0.6"/>`;
};
const fTri = (x, y, rot) => `<g transform="translate(${x} ${y}) rotate(${rot})" fill="#000000"><rect x="-3" y="-2.2" width="6" height="1"/><rect x="-3" y="-0.5" width="6" height="1"/><rect x="-3" y="1.2" width="6" height="1"/></g>`;

function poolInfo() {
  const on = new Set(state.leagues);

  for (const ty of TYPES) {
    if (!state.types.includes(ty)) continue;
    const base = [];

    let part = base.filter(i => Q[i].lv === L);
    // too few at this level: add the nearest levels until there is enough to play
    for (let d = 1; d <= 3 && part.length < MIN_POOL; d++) {
      const near = base.filter(i => Math.abs(Q[i].lv - L) === d);
      if (near.length) { part = part.concat(near); mixed = true; }
    }
    list = list.concat(part);
  }

}
function pool() { return poolInfo().list; }

/* random whole number 0 … n-1, using the device's secure random source when available */
function rand(n) {
  try {
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return buf[0] % n;
  } catch (e) {
    return Math.floor(Math.random() * n);
  }
}

/* ---------- question mixing ----------
   1. Each selected question type gets the same chance.
   2. Inside that type every question gets a score:
      - questions you have never seen score highest, then the ones seen longest ago,
      - a question only returns after at least half of the others of its type were played,
      - clubs, nations and positions from the last two questions cost points,
      - a random share keeps the order different every time.
   Played questions are remembered across matches and app restarts. */
function qTokens(i) {
  const q = Q[i];
  if (q.t === "cc") return [q.a, q.b];
  return [q.a, (q.t === "cn" ? "#" : "@") + q.b];
}
function qKey(i) { return Q[i].t + "/" + qTokens(i).slice().sort().join("|"); }
function keyTokens(k) { return k.slice(k.indexOf("/") + 1).split("|"); }
function loadHistory() {
  try {
    const v = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
    return Array.isArray(v) ? v.filter(k => typeof k === "string" && k.includes("/")).slice(-600) : [];
  } catch (e) { return []; }
}
const history = loadHistory();
function remember(i) {
  history.push(qKey(i));
  if (history.length > 600) history.splice(0, history.length - 600);
  try { localStorage.setItem(HIST_KEY, JSON.stringify(history)); } catch (e) {}
}
function pickNext() { return pickFrom(pool()); }
function pickFrom(P) {
  if (P.length <= 1) return P[0];
  const groups = {};
  P.forEach(i => { (groups[Q[i].t] = groups[Q[i].t] || []).push(i); });
  const types = Object.keys(groups);
  const ty = types[rand(types.length)];
  const S = groups[ty];
  if (S.length === 1) return S[0];
  const n = S.length;
  const H = history.filter(k => k.startsWith(ty + "/"));
  const lastPos = new Map();
  H.forEach((k, pos) => lastPos.set(k, pos));
  const age = i => { const pos = lastPos.get(qKey(i)); return pos === undefined ? Infinity : H.length - pos; };
  const gap = Math.max(1, Math.floor(n * 0.5));
  const tokensOf = k => new Set(history.slice(-k).flatMap(keyTokens));
  const last1 = tokensOf(1), last2 = tokensOf(2);
  const shares = (i, set) => qTokens(i).some(x => set.has(x));
  const jitter = Math.max(6, n * 0.7);
  let best = S[0], bestScore = -Infinity;
  for (const i of S) {
    const a = age(i);
    let score = (a === Infinity ? 3 * n : a) + (rand(1e6) / 1e6) * jitter;
    if (a <= gap) score -= 10 * n + 1000;                 // played too recently
    if (shares(i, last1)) score -= n * 0.7 + 4;           // same club, nation or position as the last question
    else if (shares(i, last2)) score -= n * 0.3 + 1;      // same as the one before
    if (score > bestScore) { bestScore = score; best = i; }
  }
  return best;
}

function scramble(name) {
  const abc = "abcdefghiklmnoprstuvz";
  return name.replace(/\S/g, ch => {
    const r = abc[Math.floor(Math.random() * abc.length)];
    return ch === ch.toUpperCase() && ch !== ch.toLowerCase() ? r.toUpperCase() : r;
  });
}
function pColor(p) { return p === 0 ? "var(--p1)" : "var(--p2)"; }
function pName(p) { return t("player", p + 1); }

function tone(freqs, dur) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime;
    freqs.forEach((f, i) => {
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = "triangle";
      o.frequency.value = f;
      const s = t0 + i * dur;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.22, s + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
      o.connect(g).connect(audio.destination);
      o.start(s);
      o.stop(s + dur + 0.02);
    });
  } catch (e) { /* sound is optional */ }
}
function buzzFeel() { try { navigator.vibrate && navigator.vibrate(45); } catch (e) {} }
async function keepAwake() {
  try { if (navigator.wakeLock && !wake) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}

/* ---------- pitch rendering ---------- */
function question() {
  const q = Q[state.qi];
  if (q.t === "cc" && state.swap) return { ...q, a: q.b, b: q.a };
  return q;
}
function sideName(q, side) {
  const id = q[side];
  if (side === "a" || q.t === "cc") return clubName(id);
  const src = q.t === "cn" ? NATIONS[id] : POSITIONS[id];
  return src.l[state.lang] || src.l.en;
}
function crest(id) {
  const c = CLUBS[id];
  const bg = c.c2 ? `linear-gradient(135deg, ${c.c1} 0 50%, ${c.c2} 50% 100%)` : c.c1;
  return `<figure class="club"><div class="crest" style="background:${bg};color:${c.ink}"><span>${c.s}</span></div><figcaption>${clubName(id)}</figcaption></figure>`;
}
function flagBadge(q) {
  const nat = NATIONS[q.b];
  return `<figure class="club"><div class="crest flag"><svg class="fill" viewBox="0 0 30 30" preserveAspectRatio="none" aria-hidden="true">${nat.f}</svg><span class="code">${nat.s}</span></div><figcaption>${sideName(q, "b")}</figcaption></figure>`;
}
function posBadge(q) {
  const dots = POSITIONS[q.b].dots.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.8" class="pt-dot"/>`).join("");
  const svg = `<svg class="fill" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" class="pt-turf"/>` +
    `<g class="pt-line"><rect x="5" y="2" width="30" height="36"/><line x1="5" y1="20" x2="35" y2="20"/><circle cx="20" cy="20" r="4.5"/><rect x="12.5" y="2" width="15" height="6"/><rect x="12.5" y="32" width="15" height="6"/></g>${dots}</svg>`;
  return `<figure class="club"><div class="crest pos">${svg}</div><figcaption>${sideName(q, "b")}</figcaption></figure>`;
}
function pairHTML(q) {
  const right = q.t === "cc" ? crest(q.b) : q.t === "cn" ? flagBadge(q) : posBadge(q);
  return `<div class="pair">${crest(q.a)}<span class="amp">&amp;</span>${right}</div>`;
}
function miniPair(q) {
  return `<p class="mini">${sideName(q, "a")} &amp; ${sideName(q, "b")}</p>`;
}
function solutions(q, label, mode) {
  const veiled = mode === "veiled";
  const cls = veiled ? "sol veiled" : mode === "unveiled" ? "sol unveiled" : "sol";
  const items = q.players.map(n => `<li><span>${veiled ? scramble(n) : n}</span></li>`).join("");
  return `<p class="label">${label}</p><ul class="${cls}"${veiled ? ' aria-hidden="true"' : ""}>${items}</ul>`;
}
function clockText(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return "0:" + String(s).padStart(2, "0");
}
function running() { return state.phase === "question" || state.phase === "buzzed"; }
function hud(me) {
  const op = 1 - me;
  return `<div class="hud">
    <span class="who">${pName(me)}</span>
    <span class="clock">${running() ? clockText(state.left) : "–"}</span>
    <span class="tally"><b>${state.scores[me]}</b><span>:</span><span>${state.scores[op]}</span><small>${t("opp")}</small></span>
  </div>`;
}

function stageHTML(me) {
  const op = 1 - me;
  const q = question();
  switch (state.phase) {
    case "lang":
    case "menu":
    case "intro":
    case "question":
      return `${pairHTML(q)}
        <p class="ask">${t(q.t === "cc" ? "ask" : "ask_" + q.t)}</p>
        <p class="hint">${t("hint")}</p>`;

    case "buzzed":
      if (me === state.buzzer) {
        if (state.answerOver) {
          return `<p class="big" style="color:var(--bad)">${t("timeUp")}</p>
            <p class="sub">${t("decides", pName(op))}</p>
            ${miniPair(q)}`;
        }
        if (state.revealed) {
          return `<p class="sub">${t("checking", pName(op))}</p>${miniPair(q)}`;
        }
        return `<p class="big" style="color:${pColor(me)}">${t("yourTurn")}</p>
          <p class="count" data-count>${Math.max(0, Math.ceil(state.left / 1000))}</p>
          <p class="sub">${t("sayIt")}</p>
          ${miniPair(q)}`;
      }
      if (!state.revealed) {
        return `<p class="sub"><strong style="color:${pColor(state.buzzer)}">${t("buzzed", pName(state.buzzer))}</strong></p>
          ${miniPair(q)}
          ${solutions(q, t("example"), "veiled")}
          <p class="wait">${t("waitReveal")}</p>
          <button class="btn" type="button" data-act="reveal">${t("reveal")}</button>`;
      }
      return `<p class="sub">${state.answerOver ? t("inTime") : t("judgeQ")}</p>
        ${miniPair(q)}
        ${solutions(q, t("example"), "unveiled")}
        <div class="row">
          <button class="btn" type="button" data-act="yes">${t("yes")}</button>
          <button class="btn ghost" type="button" data-act="no">${t("no")}</button>
        </div>`;

    case "result": {
      const b = state.buzzer;
      let big, sub, color;
      if (me === b) {
        if (state.outcome === "hit") { big = t("hit"); sub = t("plus1you"); color = pColor(me); }
        else { big = t("no"); sub = t("pointTo", pName(op)); color = "var(--bad)"; }
      } else {
        if (state.outcome === "hit") { big = t("knewIt"); sub = t("plusP", pName(b)); color = pColor(b); }
        else { big = t("plus1"); sub = t("missed", pName(b)); color = pColor(me); }
      }
      return `<p class="big" style="color:${color}">${big}</p>
        <p class="sub">${sub}</p>
        ${solutions(q, t("answers"))}
        <button class="btn" type="button" data-act="next">${t("next")}</button>`;
    }

    case "timeout":
      return `<p class="big">${t("whistle")}</p>
        <p class="sub">${t("nobody")}</p>
        ${solutions(q, t("answers"))}
        <button class="btn" type="button" data-act="next">${t("next")}</button>`;

    case "end": {
      const won = state.scores[me] > state.scores[op];
      return `<p class="big" style="color:${won ? pColor(me) : "var(--chalk)"}">${won ? t("won") : t("lost")}</p>
        <p class="sub">${t("final", state.scores[me], state.scores[op])}</p>
        <div class="row">
          <button class="btn" type="button" data-act="again">${t("rematch")}</button>
          <button class="btn ghost" type="button" data-act="menu">${t("menu")}</button>
        </div>`;
